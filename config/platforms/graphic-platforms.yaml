# Graphic/text delivery platform specifications.
#
# WHY THIS FILE EXISTS
# --------------------
# Before this file the GRAPHIC_TEXT line had exactly four platforms hard-coded
# in src/contentops/platforms/multichannel.py and four invented limit tuples in
# PLATFORM_RULES. That is not a platform matrix, it is four guesses. This file
# is the single source of truth for "which graphic platforms do we deliver to,
# what are their shapes, and through which channel".
#
# PROVENANCE
# ----------
# Limit values are engineering figures with an explicit `basis` field. They are
# NOT a platform SLA and NOT a compliance claim:
#   official    - stated by the platform itself in help centre / API docs
#   third_party - taken from an open-source project's platform matrix
#   project     - this repository's own editorial convention
# A `basis` of third_party means "another team measured it against a live
# editor at some point". Treat it as a shaping hint, never as a legal limit.
#
#   third_party source: veeicwgy/ip-publisher @ 2121445098d46cfa2947e3088f84b1255fa8fa13
#                       config/platforms.yaml  (MIT)
#   channel names     : wechatsync/Wechatsync @ v2 (6589 stars), CLI 1.1.0
#                       `wechatsync platforms` adapter ids
#
# REGISTRY BOUNDARY
# -----------------
# `registry_row: true` means the platform also exists in
# config/registry/platforms.json. `registry_row: false` means it is a delivery
# channel only: this file may describe it, but it must never be used to add a
# registry row or to upgrade any row's status. Status stays a claim about
# evidence, not about configuration.

schema: contentops.graphic-platforms/v1

# Two limit tiers, because one number cannot carry both meanings:
#   hard - exceeding this is a blocker; the platform will truncate or reject
#   soft - exceeding this is a warning; the draft is valid but off-convention
limits_policy:
  hard_exceeded: blocker
  soft_exceeded: warning

platforms:
  - platform_id: wechat_article
    display_name: 微信公众号
    registry_row: true
    strategy_platform: wechat_official_account
    pipeline: GZH_EDITORIAL
    production_line: GRAPHIC_TEXT
    native_format: html
    title_max_hard: 64
    title_max_hard_basis: official
    title_max_soft: 25
    title_max_soft_basis: project
    body_max_hard: 20000
    body_max_hard_basis: third_party
    body_max_soft: 20000
    summary_max: 120
    needs_cover: true
    cover_ratio: "2.35:1"
    recommended_tags: 0
    channels:
      - id: wechatpy:draft
        kind: api
        requires: [WECHAT_1_APPID, WECHAT_1_APPSECRET, ip_whitelist]
        draft_only: true
        note: material.add → draft.add → draft.get 回读；不群发
      - id: wechatsync:weixin
        kind: browser_bridge
        requires: [chrome_extension, WECHATSYNC_TOKEN, platform_login]
        draft_only: true

  - platform_id: zhihu
    display_name: 知乎
    registry_row: true
    strategy_platform: zhihu
    pipeline: ARTICLE_EDITORIAL
    production_line: TEXT_EDITORIAL
    native_format: markdown
    title_max_hard: 100
    title_max_hard_basis: third_party
    title_max_soft: 60
    title_max_soft_basis: project
    body_max_hard: 100000
    body_max_hard_basis: third_party
    body_max_soft: 5000
    summary_max: 120
    needs_cover: true
    cover_ratio: "16:9"
    recommended_tags: 5
