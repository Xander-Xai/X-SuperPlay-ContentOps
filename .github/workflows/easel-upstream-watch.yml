name: Easel Upstream Watch

on:
  schedule:
    # Daily at 09:00 UTC (17:00 Beijing time)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check Easel upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run upstream watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_easel_upstream.py --quiet || ACTION_NEEDED=1
          python scripts/check_easel_upstream.py > /tmp/watch_report.json
          cat /tmp/watch_report.json

      - name: Find or create rolling upstream issue
        if: env.ACTION_NEEDED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find existing rolling issue
          ISSUE_NUMBER=$(gh issue list --label "upstream:easel" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -z "$ISSUE_NUMBER" ]; then
            # Create new rolling issue
            ISSUE_NUMBER=$(gh issue create \
              --title "[UPSTREAM] Easel compatibility watch" \
              --label "upstream:easel,area:easel" \
              --body "Rolling issue tracking Easel upstream compatibility. Updated by automated watch workflow." \
              --json number --jq '.number')
          fi
          
          # Update issue body with latest report
          REPORT=$(cat /tmp/watch_report.json)
          gh issue edit "$ISSUME_NUMBER" --body "## Easel Upstream Watch Report

          Auto-generated by GitHub Actions.

          \`\`\`json
          $REPORT
          \`\`\`

          Rolling issue tracking Easel upstream compatibility."