name: Easel Upstream Watch

on:
  schedule:
    # Daily at 09:00 UTC (17:00 Beijing time)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force update rolling issue even if no change detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check Easel upstream
    runs-on: ubuntu-latest
    outputs:
      action_needed: ${{ steps.watch.outputs.action_needed }}
      recommendation: ${{ steps.watch.outputs.recommendation }}
      report_path: ${{ steps.watch.outputs.report_path }}
      issue_number: ${{ steps.notify.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run upstream watch
        id: watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_easel_upstream.py > /tmp/watch_report.json
          cat /tmp/watch_report.json

          # Persist recommendation to GitHub output
          REC=$(python scripts/check_easel_upstream.py --quiet; echo $?)
          if [ "$REC" = "0" ]; then
            echo "recommendation=NO_ACTION" >> $GITHUB_OUTPUT
            echo "action_needed=false" >> $GITHUB_OUTPUT
          else
            echo "recommendation=WATCH_OR_UPDATE" >> $GITHUB_OUTPUT
            echo "action_needed=true" >> $GITHUB_OUTPUT
          fi
          echo "report_path=/tmp/watch_report.json" >> $GITHUB_OUTPUT

      - name: Find or create rolling upstream issue
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use gh api to get the issue number (no --json flag on gh issue create)
          ISSUE_NUMBER=$(gh issue list \
            --label "upstream:easel" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$ISSUE_NUMBER" ]; then
            # Create rolling issue using gh api (supports JSON output)
            CREATE_RESP=$(gh api repos/${{ github.repository }}/issues \
              --method POST \
              -f title="[UPSTREAM] Easel compatibility watch" \
              -f body="Rolling issue tracking Easel upstream compatibility. Updated by automated watch workflow." \
              -f labels='["upstream:easel","area:easel"]' \
              --silent)
            ISSUE_NUMBER=$(echo "$CREATE_RESP" | python -c "import sys,json; print(json.load(sys.stdin)['number'])")
          fi
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "Found/created issue #$ISSUE_NUMBER"

      - name: Update rolling issue on change or force
        id: notify
        if: ${{ steps.watch.outputs.action_needed == 'true' || inputs.force_notify == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ steps.find_issue.outputs.issue_number }}
          REPORT=$(cat /tmp/watch_report.json)

          # Escape newlines for JSON body
          REPORT_ESCAPED=$(echo "$REPORT" | python -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER \
            --method PATCH \
            -f body="## Easel Upstream Watch Report

Auto-generated by GitHub Actions workflow run: ${{ github.run_id }}

### Recommendation

\`${{ steps.watch.outputs.recommendation }}\`

### Latest Report

\`\`\`json
$REPORT
\`\`\`

### About This Watch

- Watch schedule: daily via GitHub Actions
- Watcher role: DETECT → CLASSIFY → REPORT (never auto-upgrades)
- Upgrade gate: see docs/UPSTREAM-EASEL.md

Refs #13
Refs #7
" \
            --silent

          echo "Updated issue #$ISSUE_NUMBER"

      - name: No action needed
        if: ${{ steps.watch.outputs.action_needed != 'true' && inputs.force_notify != 'true' }}
        run: |
          echo "No upstream change detected. Rolling issue not updated."
