name: Easel Upstream Watch

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: Force update rolling issue even if no change detected
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check Easel upstream
    runs-on: ubuntu-latest
    outputs:
      action_needed: ${{ steps.watch.outputs.action_needed }}
      recommendation: ${{ steps.watch.outputs.recommendation }}
      issue_number: ${{ steps.find_issue.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run upstream watch
        id: watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_easel_upstream.py > /tmp/watch_report.json
          cat /tmp/watch_report.json
          python scripts/check_easel_upstream.py --quiet
          if [ "$?" -eq 0 ]; then
            echo "action_needed=false" >> $GITHUB_OUTPUT
            echo "recommendation=NO_ACTION" >> $GITHUB_OUTPUT
          else
            echo "action_needed=true" >> $GITHUB_OUTPUT
            echo "recommendation=WATCH_OR_UPDATE" >> $GITHUB_OUTPUT
          fi
      - name: Find or create rolling upstream issue
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list --label "upstream:easel" --state open --limit 1 --json number --jq "[.[]] | .[0].number" 2>/dev/null || echo "")
          if [ -z "$ISSUE_NUMBER" ]; then
            RESP=$(gh api repos/${{ github.repository }}/issues --method POST -f title="[UPSTREAM] Easel compatibility watch" -f body="Rolling issue tracking Easel upstream compatibility." -f labels='["upstream:easel","area:easel"]' --silent)
            ISSUE_NUMBER=$(echo "$RESP" | python -c "import sys,json; print(json.load(sys.stdin)["number"])")
          fi
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "Found/created issue #$ISSUE_NUMBER"
      - name: Update rolling issue on change
        if: ${{ steps.watch.outputs.action_needed == 'true' || inputs.force_notify == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.find_issue.outputs.issue_number }}"
          REPORT=$(cat /tmp/watch_report.json)
          REC="${{ steps.watch.outputs.recommendation }}"
          RUN_ID="${{ github.run_id }}"
          python - << 'PYEOF_INNER'
          import os
          report = open("/tmp/watch_report.json").read()
          rec = os.environ.get("REC", "UNKNOWN")
          run_id = os.environ.get("RUN_ID", "unknown")
          lines = [
              "## Easel Upstream Watch Report",
              "",
              "Auto-generated by GitHub Actions workflow run: " + run_id,
              "",
              "### Recommendation",
              "",
              "`" + rec + "`",
              "",
              "### Latest Report",
              "",
              "```json",
              report,
              "```",
              "",
              "### About This Watch",
              "",
              "- Watch schedule: daily via GitHub Actions",
              "- Watcher role: DETECT > CLASSIFY > REPORT (never auto-upgrades)",
              "- Upgrade gate: see docs/UPSTREAM-EASEL.md",
              "",
              "Refs #13",
              "Refs #7",
          ]
          with open("/tmp/issue_body.txt", "w", encoding="utf-8") as f:
              f.write(chr(10).join(lines))
          PYEOF_INNER
          gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER --method PATCH -F body=@/tmp/issue_body.txt --silent
          echo "Updated issue #$ISSUE_NUMBER"
      - name: No action needed
        if: ${{ steps.watch.outputs.action_needed != 'true' && inputs.force_notify != 'true' }}
        run: |
          echo "No upstream change detected. Rolling issue not updated."