name: Easel Upstream Watch

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: Write the report even if no upstream change is detected
        required: false
        default: "false"
        type: boolean

# ADR-018 D4: the watch reports through the job summary and a workflow
# artifact. It must not create or update an issue, and it never commits to the
# repository (main is protected and PRs must not be opened by automation).
permissions:
  contents: read

jobs:
  check-upstream:
    name: Check Easel upstream
    runs-on: ubuntu-latest
    outputs:
      action_needed: ${{ steps.watch.outputs.action_needed }}
      recommendation: ${{ steps.watch.outputs.recommendation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run upstream watch
        id: watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_easel_upstream.py > "$RUNNER_TEMP/watch_report.json"
          if python scripts/check_easel_upstream.py --quiet; then
            echo "action_needed=false" >> "$GITHUB_OUTPUT"
            echo "recommendation=NO_ACTION" >> "$GITHUB_OUTPUT"
          else
            echo "action_needed=true" >> "$GITHUB_OUTPUT"
            echo "recommendation=WATCH_OR_UPDATE" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/watch_report.json"

      - name: Write watch report
        if: ${{ steps.watch.outputs.action_needed == 'true' || inputs.force_notify }}
        env:
          REC: ${{ steps.watch.outputs.recommendation }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/easel-watch"
          cp "$RUNNER_TEMP/watch_report.json" "$RUNNER_TEMP/easel-watch/easel-watch-latest.json"
          python - << 'PYEOF_INNER'
          import os
          report = open(os.path.join(os.environ["RUNNER_TEMP"], "watch_report.json"), encoding="utf-8").read()
          rec = os.environ.get("REC", "UNKNOWN")
          run_id = os.environ.get("RUN_ID", "unknown")
          lines = [
              "## Easel Upstream Watch Report",
              "",
              "Auto-generated by GitHub Actions workflow run: " + run_id,
              "",
              "### Recommendation",
              "",
              "`" + rec + "`",
              "",
              "### Latest Report",
              "",
              "```json",
              report,
              "```",
              "",
              "### About This Watch",
              "",
              "- Watch schedule: daily via GitHub Actions",
              "- Watcher role: DETECT > CLASSIFY > REPORT (never auto-upgrades)",
              "- Report location: workflow summary and the `easel-upstream-watch-<run_id>` artifact",
              "- Upgrade gate: see docs/UPSTREAM-EASEL.md",
          ]
          body = chr(10).join(lines)
          out = os.path.join(os.environ["RUNNER_TEMP"], "easel-watch", "easel-watch-latest.md")
          with open(out, "w", encoding="utf-8") as f:
              f.write(body)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(body + chr(10))
          PYEOF_INNER

      - name: Upload watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easel-upstream-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/easel-watch
          retention-days: 90
          if-no-files-found: warn

      - name: No action needed
        if: ${{ steps.watch.outputs.action_needed != 'true' && !inputs.force_notify }}
        run: |
          echo "No upstream change detected. No report written."
