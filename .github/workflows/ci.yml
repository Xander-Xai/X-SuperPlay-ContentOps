name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners default stdout to cp1252; several suites print the
      # repository's Chinese labels. UTF-8 mode makes every suite deterministic
      # without editing each one or weakening an assertion.
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade pip Pillow

      # ffmpeg was absent on both runners, and the M4 H3 suite plus the M4.5
      # transform tests need it. Installing it here is what turns those skips into
      # real coverage; without it a green run silently meant far less than it
      # appeared to. The step below reports availability precisely so that gap
      # cannot reopen unnoticed.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --limit-output --allow-downgrade
          # The chocolatey shim directory is where ffmpeg.exe lands; adding it
          # explicitly keeps this working whether or not the runner image already
          # has it on PATH.
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\bin" >> $env:GITHUB_PATH
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      # Report what is actually available. A suite that silently skips most of
      # itself looks green while testing nothing, which is how the M3 suite lost
      # half its coverage on a runner without ffmpeg before this step existed.
      - name: Report test dependency availability
        run: python -c "import shutil,sys; print('ffmpeg:', bool(shutil.which('ffmpeg'))); print('ffprobe:', bool(shutil.which('ffprobe'))); import PIL; print('Pillow:', PIL.__version__)"

      - name: Run basic tests
        run: python scripts/test_basic.py

      # The media suites never make a provider request: they drive
      # tests/fixtures/fake_mmx_cli.py and inject a fake billing transport, so CI
      # needs no MiniMax account and spends no quota.
      - name: Run M2 speech regression tests
        run: python tests/test_minimax_speech.py

      # M2.1 voice cloning. Every test drives a fake transport or a refusal path, so no
      # clone, upload or synthesis can happen here. The one billable clone is a manual,
      # explicitly-confirmed action; this suite exists to prove it cannot happen by
      # accident, which is why the fee-confirmation and one-attempt checks matter more
      # than the happy path.
      - name: Run M2.1 voice-clone regression tests
        run: python tests/test_minimax_voice_clone.py

      # M2.2 two-key clone route. Pure policy: the route decision reads credentials,
      # a billing verdict and a clock, and performs no I/O. So the PAYG key, the
      # cross-key claim and the 168-hour clone lifetime are all testable in CI with
      # no provider account and nothing spent -- which is the only place the
      # "provisioning a key must not look like a working route" invariant can be
      # checked at all, since the real route is blocked on a human action.
      - name: Run M2.2 clone-route regression tests
        run: python tests/test_minimax_clone_route.py

      # The one-time voucher activation authorisation. Pure policy, like the route
      # gate above: it decides whether a CNY 9.9154 charge may be attempted, and the
      # decisive rule is that an UNPROVEN voucher scope refuses no matter how much
      # balance shows. That invariant can only be tested here, because the live path
      # is blocked on a fact no API client can read.
      - name: Run M2.2 voucher-activation regression tests
        run: python tests/test_voucher_activation.py

      # The cash-activation recovery policy. It was added in the #34 rounds without
      # being wired in here, so its 20+ gate assertions only ever ran on one machine.
      - name: Run cash-activation recovery regression tests
        run: python tests/test_cash_activation_recovery.py

      # The native CN T2A adapter and the host-binding audit. Both suites are fully
      # offline: every provider interaction is a fake transport. The decisive
      # assertions are that a non-CN host is refused before the transport is
      # touched, that exactly one request is possible with no retry, that a provider
      # refusal keeps its status code and trace id instead of collapsing into a
      # string, and that neither a refusal nor a public summary can carry the
      # credential.
      - name: Run native T2A adapter regression tests
        run: python tests/test_minimax_native_tts.py

      - name: Run host-binding audit regression tests
        run: python tests/test_host_binding_audit.py

      # The native-credential rounds: the PAYG activation gate, the M Plan
      # narration gate, plan-only classification and the append-only history.
      # Fully offline; the decisive assertions are that each route's header
      # carries exactly its own credential, that neither gate can be satisfied
      # by the other route's key, and that the historical attempts survive.
      - name: Run native-rounds regression tests
        run: python tests/test_native_rounds.py

      # Narration v2. Segment delivery: content-addressed cache, partial
      # regeneration, deterministic joins (wave fixtures + ffmpeg), and the
      # documented pause/emotion payload rules. Fully offline.
      - name: Run segment-delivery regression tests
        run: python tests/test_t2a_segments.py

      # The spoken-script stage: evidence-lock binding, digit-token
      # preservation, protected phrases, pause syntax, role coverage and the
      # three-way version map. Fully offline; no provider surface exists.
      - name: Run spoken-script regression tests
        run: python tests/test_spoken_script.py

      # The A/B sample experiment policy: narration credential binding must
      # never borrow the pay-as-you-go variable, the budget arithmetic is the
      # published counting rule, the dry run completes offline and transmits
      # nothing, and the new scripts have no PAYG/clone/transfer surface.
      - name: Run A/B sample policy tests
        run: python tests/test_ab_sample_policy.py

      # Narration v3. The creator-script stage: fact-script and evidence-lock
      # binding, digit preservation with declared omissions, preserved facts,
      # template-marketing refusal, first-person bases, beat structure and the
      # version map. Fully offline.
      - name: Run creator-script regression tests
        run: python tests/test_creator_script.py

      # The narration director: per-unit intent metadata, auto-emotion default,
      # calm-at-most-once and no-majority rules, bounded homogeneous speeds,
      # intent-paced pauses with unique anchors, intent-grouped synthesis and
      # single-unit-group discipline. Fully offline.
      - name: Run narration-director regression tests
        run: python tests/test_narration_director.py

      # The v3 D/E/F sample policy: offline dry run, label-blind candidate
      # files, budget estimate, preset-voice evidence binding, no PAYG/clone
      # surface in the new scripts.
      - name: Run narration-v3 policy tests
        run: python tests/test_narration_v3_policy.py

      - name: Run M3 image regression tests
        run: python tests/test_minimax_image.py

      # M4 and M4.5 were merged without these two being wired in, so a green CI run
      # was not evidence that 205 tests passed. A suite that is not executed cannot
      # report a pass, and the gap was invisible precisely because CI looked healthy.
      - name: Run M4 H3 video regression tests
        run: python tests/test_minimax_h3.py

      - name: Run M4.5 media convergence regression tests
        run: python tests/test_media_convergence.py

      # M4.6 provider-free: fixtures only, no MiniMax request, no quota. Skips
      # itself when the M4.5 artifacts are absent, which they are on a clean
      # checkout because media binaries are gitignored.
      - name: Run M4.6 enhanced golden infrastructure tests
        run: python tests/test_enhanced_golden.py

      # Source-evidence gitignore policy and the production lock's input
      # reproducibility. Both are pure repository state, so they never skip.
      - name: Run source-evidence gitignore policy tests
        run: python tests/test_gitignore_evidence_policy.py

      - name: Run locked-input reproducibility tests
        run: python tests/test_locked_input_reproducibility.py

      # A/B voice variants. Runs on a clean checkout with no gitignored audio present,
      # which is the point: the voice-provenance gates resolve from the tracked Golden
      # fixtures. They used to skip here, so the provenance claims they defend were
      # only ever checked on one machine.
      - name: Run M4.6 A/B voice variant tests
        run: python tests/test_golden_variant_ab.py

      # The Golden voice fixture exception. Asserts the two approved files are tracked
      # and everything else -- other provider output, .verify-tmp, another project's
      # voice assets, and both rendered finals -- stays ignored.
      - name: Run Golden voice media policy tests
        run: python tests/test_golden_voice_assets.py

      # Clones the repository, deletes every host-local input, and resolves the lock,
      # both narrations and B's provider receipt from Git alone. This is the suite that
      # would have caught the host-local provenance before it shipped, and it is the
      # only one that reproduces a second engineer's checkout.
      - name: Run Golden voice clean-checkout rebuildability tests
        run: python tests/test_golden_voice_rebuildability.py

      # ASS timestamps are centiseconds. Emitting milliseconds stretched every cue
      # by 10x and QC only checked that a subtitle existed, so the desync survived a
      # green run until a real render was inspected frame by frame.
      - name: Run subtitle burn timing tests
        run: python tests/test_subtitle_timing.py

      # The provider-free half of narration -> video: unit to evidence mapping,
      # duration splitting and the SRT the burn consumes.
      - name: Run v3 sample-video bridge tests
        run: python tests/test_v3_sample_video.py

      # Skill-first routing: the rule is stated in CLAUDE.md and AGENTS.md and is
      # executable through scripts/skill_route.py. The catalog half skips itself
      # when the gitignored Easel runtime is absent.
      - name: Run skill-route policy tests
        run: python tests/test_skill_route_policy.py

      # Every project track must be routable, not just Easel. The vendored
      # 公众号 catalog is checked here; the test skips itself when the vendor
      # directory is absent.
      - name: Run skill-route catalog tests
        run: python tests/test_skill_route_catalogs.py

      # The doctor and exact resolver: catalog roots, duplicate names, the
      # permissions a skill declares, and paths that leave the trusted roots.
      # It never executes a skill.
      - name: Run skill doctor tests
        run: python tests/test_skill_doctor.py

      # The OpenClaw bridge: envelope parsing among ANSI logs, OEM-codepage
      # decoding, a receipt on every failure path, and no absolute paths in a
      # committed receipt. Route-resolution tests skip without the Easel runtime.
      - name: Run OpenClaw bridge tests
        run: python tests/test_openclaw_agent.py

      # The copy gate: every producer stops after the copy until a person records
      # a decision against the current copy fingerprint. Build metadata must not
      # invalidate a review; a copy change must.
      - name: Run copy-review gate tests
        run: python tests/test_copy_review.py

      # One source, two native assets: 1024 opens on the conflict and re-orders
      # complete units; Future Intelligence keeps the eight-unit walkthrough.
      # Both stop at PENDING_FOUNDER_REVIEW and claim no publication URL.
      - name: Run two-account variant tests
        run: python tests/test_account_variants.py

      # The account DNA is the gene: brand base, composition ratios, caption
      # style, cover floor and the one-click prompt have to agree, or the
      # pipeline renders a different look from the one the account asked for.
      - name: Run account DNA tests
        run: python tests/test_account_dna.py

      # The discovery block: every search term must resolve to a field of the
      # account's own DNA, or the router would search somewhere the account
      # never asked to go.
      - name: Run account discovery tests
        run: python tests/test_account_discovery.py

      # The content router: two routes, one contract, and the human gates.
      # A candidate never becomes a brief without a choice, and a brief never
      # becomes production without an approval.
      - name: Run content router tests
        run: python tests/test_content_router.py

      # The hot-list side: sources, the search plan, the account-weighted
      # ranking, de-duplication, and the failures a real collector meets.
      - name: Run hotspot source tests
        run: python tests/test_hotspot_sources.py

      # The source-quality gate: a keyword match is not a project. Two
      # independent signals reject; one never does; an uninspected repository
      # passes marked rather than being dropped.
      - name: Run source quality tests
        run: python tests/test_source_quality.py

      # The script stage: an approved brief becomes copy under the claim
      # contract. Nothing is invented, and a degraded forecast stops at
      # EVIDENCE_REQUIRED instead of producing a script.
      - name: Run script draft tests
        run: python tests/test_script_draft.py

      # The optimization layer: signal validation, ADOPT policy (GitHub + evidence
      # + no GPU), action-before-deferral ranking and the blocked MEASURE/LEARN
      # flywheel stages.
      - name: Run optimization-layer tests
        run: python tests/test_optimization_layer.py

      # The retention gate: longest identical visual run, hook length, captions,
      # cover and CTA. It is a warning gate, not a taste score.
      - name: Run retention-gate tests
        run: python tests/test_retention.py

      - name: Run Windows subprocess tests
        run: python tests/test_windows_subprocess.py

      - name: Run Windows path tests
        run: python tests/test_windows_paths.py

      # The four evidence contracts that gate V2: what a capture proves, how a
      # derivative links to its raw source, which exact text is claim-bound, and
      # which placements/crops/timings the finished cut may contain.
      - name: Run capture-proof tests
        run: python tests/test_capture_proof.py

      - name: Run redaction-lineage tests
        run: python tests/test_evidence_redaction.py

      - name: Run claim-map tests
        run: python tests/test_claim_map.py

      - name: Run cut-plan tests
        run: python tests/test_cut_plan.py

      # Capture is allowlist-driven and never opens a window in CI: these cover
      # plan refusal, environment sanitizing, wrapper generation and dry run.
      - name: Run terminal-capture tests
        run: python tests/test_terminal_capture.py

      # Redaction lineage and context-preserving crops. Uses a synthetic clip:
      # masks are proven by pixel, audio removal by stream absence, and an
      # enlarged crop must be contained by its earlier context crop.
      - name: Run redaction and context tests
        run: python tests/test_context_preservation.py

      # The two editorial packages: exact claim binding, no generated evidence,
      # different opening/order/target/CTA, and citation cards kept a minority.
      - name: Run editorial-package tests
        run: python tests/test_evidence_cut_editorial.py

      # Target-aware QC: duration-weighted real-source share, generated cap,
      # exact target dimensions, captions and cover presence.
      - name: Run evidence cut QC tests
        run: python tests/test_evidence_cut_qc.py

      # The account decides the pipeline. Two accounts, two chains; the mode is
      # what chooses, and the probe refuses an undeclared mode instead of guessing.
      - name: Run account-route tests
        run: python tests/test_account_route.py

      # Per-platform frames: only the platform whose frame differs is derived, an
      # ungraded or failing master is refused, and the tool that ran is bound.
      - name: Run variant-derivation tests
        run: python tests/test_derive_variants.py

      # The external 公众号 workflow's cold archive. Its history diverged from
      # GitHub origin, so the pin checks a bundle digest and a restored tree, not
      # an upstream branch that does not contain these commits.
      - name: Run external-pin tests
        run: python tests/test_gzh_pin.py

      # Review bundles: input-only fingerprints, stale-review invalidation and
      # the score-80 threshold with no hard fail.
      - name: Run review-bundle tests
        run: python tests/test_review_bundle.py

      # The ordered production contract. These suites are the mechanical answer
      # to "nothing stopped a build from skipping a stage": stage order,
      # freshness invalidation, check/approve and the refusal to keep an
      # approval after the bytes change. Stdlib only, no media, never skips.
      - name: Run production-contract tests
        run: python tests/test_workflow_contract.py

      - name: Run production-gate tests
        run: python tests/test_workflow_gate.py

      # Editorial gates a codec check cannot see: one deterministic quality
      # verdict, a script that is sayable in its window, and subtitles that do
      # not overlap or overflow a portrait frame.
      - name: Run editorial quality-gate tests
        run: python tests/test_quality_gates.py

      # Per-claim evidence coverage: the gate that replaces a whole-film
      # real-source ratio. Proves a factual claim cannot be carried by a card,
      # motion clip or generated visual, and that a CLAIM_LED package makes the
      # ratio advisory without weakening the claim requirement.
      - name: Run claim-coverage tests
        run: python tests/test_claim_coverage.py

      # Audience Lens and duration policy: one viewer per cut, with a stated
      # trigger, workaround, proof requirement and emotion turn; and a target
      # length that sits inside the band its content type owns.
      - name: Run audience and duration tests
        run: python tests/test_audience_duration.py

      # Capabilities absorbed from the retired dy_x1024 workspace: topic
      # backlog and candidate scoring, evidence feasibility, platform policy,
      # rights ledger, improvement log, feedback/metrics and skill provenance.
      - name: Run absorbed workflow-document tests
        run: python tests/test_absorbed_workflow_docs.py

      # Package identity, delivery manifest, semantic visual route, copy
      # strategy card and the technical-explainer editorial gate.
      - name: Run naming, delivery and route tests
        run: python tests/test_naming_delivery_route.py

      # The reviewed list a rights ledger must descend from: a source candidate
      # keeps its canonical page, creator, licence text and URL, capture date
      # and score, and may never mark itself cleared. Absorbed from the retired
      # dy_x1024 material-source-research contract.
      - name: Run source-candidate tests
        run: python tests/test_source_candidates.py

      # The pre-render script-quality rules as tests: a script table that drifts
      # from the beats, a subtitle pointer to a missing file, a storyboard
      # shorter than its captions and a missing call to action. The gate script
      # above runs on real projects only; these prove the rules themselves.
      - name: Run script-quality rule tests
        run: python tests/test_script_quality.py

      # Repository policy as tests: a tracked final or a video outside final/
      # must be reported, the allowlisted exception respected, and source code
      # must never be classified as media.
      - name: Run repository policy rule tests
        run: python tests/test_repo_policy.py

      # Who owns the evidence policy: the account decides whether a film is
      # proven or explained, the episode only its mix. These pin the split that
      # let a 100% animation cut carry a 70% real-source floor.
      - name: Run account evidence policy tests
        run: python tests/test_account_evidence_policy.py

      # The presenter opening is a declared pipeline step, not an optional
      # garnish: these prove a film cannot ship without it.
      - name: Run presenter-opening tests
        run: python tests/test_presenter_opening.py

      # Code-animation composition: the renderer's block contract and its
      # refusal paths. Previously existed but was never executed here.
      - name: Run code-animation composition tests
        run: python tests/test_code_animation_composition.py

      # The capture contract a recording-heavy cut needs before anyone records:
      # a direct observation cannot land on a card, a FORBIDDEN account cannot
      # reach a recording surface, and a capture must name what the viewer sees.
      - name: Run capture-plan tests
        run: python tests/test_capture_plan.py

      # Reference replication: a transcript may not carry cut points, a plan is
      # bound to the reference bytes, nothing from the reference may reach the
      # cut, and the finished film must still meet the account composition.
      - name: Run reference-replication tests
        run: python tests/test_reference_replication.py

      - name: Run motion-build reliability tests
        run: python tests/test_motion_build_reliability.py

      - name: Run code-animation consistency tests
        run: python tests/test_code_animation_consistency.py

      # Colloquial copy stays inside the budget it declares, filler phrases do
      # not become tics, fact-lock tokens survive the rewrite, and a burned
      # caption must transcribe the narration it sits under.
      - name: Run naturalness and caption-integrity tests
        run: python tests/test_naturalness.py

      # Drift guard: a suite that exists but is never named in this file cannot
      # report a pass, and a green CI run would cover less than it appears to.
      - name: Run suite-runner tests
        run: python tests/test_run_tests.py
      - name: Check every test suite is wired into CI
        run: python scripts/run_tests.py --missing-from .github/workflows/ci.yml

      - name: Enforce subprocess policy
        run: python scripts/check_subprocess_policy.py

      - name: Run docs consistency checks
        run: python scripts/check_docs.py

      - name: Run i18n consistency checks
        run: python scripts/check_i18n.py

      - name: Check account DNA
        run: python scripts/check_account_dna.py

      # Pre-render gate: catches the defects that only show up in a finished
      # cut (silent filler shots, unclassifiable source types, one layout
      # carrying most beats, script documents drifting from the film) before
      # anything is rendered. Projects opt in with quality_gate: enforced, so
      # this is a no-op on a checkout where no project declares it.
      - name: Check script quality
        run: python scripts/check_script_quality.py --all-gated

      - name: Check whitespace
        run: git diff --check --exit-code || exit 1

  repo-policy:
    name: Repo policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repo policy check
        run: python scripts/check_repo_policy.py
      - name: Subprocess policy check
        run: python scripts/check_subprocess_policy.py
      - name: Docs consistency check
        run: python scripts/check_docs.py
      - name: i18n consistency check
        run: python scripts/check_i18n.py
