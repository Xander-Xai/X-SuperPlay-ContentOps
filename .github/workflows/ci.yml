name: CI

on:
  push:
    branches:
      - main
      # Feature branches get the same checks without being merged into main or
      # into an unauthorised parent branch. Dispatch covers a branch whose
      # workflow predates these triggers.
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'security/**'
      - 'docs/**'
      - 'ci/**'
      - 'refactor/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the documentation-freshness suite compares each tracked
          # doc's date against the commits that touched its mapped code. In a
          # shallow clone every path looks changed at the tip, which is a clone
          # artefact rather than a stale doc.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # PyYAML is not part of the runner image, and both platform spec tables
        # (graphic-platforms.yaml, video-platforms.yaml) are read through it. The
        # suites that consume them fail loudly rather than skipping, so it has to
        # be installed here or the coverage looks larger than it is.
        #
        # pyJianYingDraft is pinned and Apache-2.0. The 剪映 handoff suite builds a
        # real draft from a fixture project, so the library has to be present at
        # exactly this version: the draft format is the contract, and the module
        # refuses any other version instead of writing a draft nobody can open.
        run: python -m pip install --quiet --upgrade pip Pillow PyYAML pyJianYingDraft==0.3.1

      # ffmpeg was absent on both runners, and the M4 H3 suite plus the M4.5
      # transform tests need it. Installing it here is what turns those skips into
      # real coverage; without it a green run silently meant far less than it
      # appeared to. The step below reports availability precisely so that gap
      # cannot reopen unnoticed.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --limit-output --allow-downgrade
          # The chocolatey shim directory is where ffmpeg.exe lands; adding it
          # explicitly keeps this working whether or not the runner image already
          # has it on PATH.
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\bin" >> $env:GITHUB_PATH
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      # Report what is actually available. A suite that silently skips most of
      # itself looks green while testing nothing, which is how the M3 suite lost
      # half its coverage on a runner without ffmpeg before this step existed.
      - name: Report test dependency availability
        run: python -c "import shutil,sys; print('ffmpeg:', bool(shutil.which('ffmpeg'))); print('ffprobe:', bool(shutil.which('ffprobe'))); import PIL; print('Pillow:', PIL.__version__); import yaml; print('PyYAML:', yaml.__version__)"

      - name: Run basic tests
        run: python scripts/test_basic.py

      # D7 governance guardrails: branch registry validation and PR size metrics.
      # Both are offline and spawn no child processes. The size check is
      # report-only here; --strict (threshold enforcement) needs an Owner decision.
      - name: Check branch registry
        run: python scripts/check_branch_registry.py

      - name: Run governance guardrail tests
        run: python tests/test_governance_checks.py

      # Offline ledger consistency: bilingual CURRENT-STATE headers/snapshots
      # and branch-registry verified_at must agree. Never queries GitHub.
      - name: Run governance ledger tests
        run: python tests/test_governance_ledger.py

      # Documentation freshness mechanism: marker parsing, stale verdicts and the
      # README Chinese-primary pairing. Pure logic plus one run over the real tree.
      - name: Run documentation sync tests
        run: python tests/test_doc_sync.py

      # Card renderer: plan/parse/receipt logic plus the refusal paths that keep a
      # card from silently claiming approval. The one live render path skips itself
      # when playwright is absent, so this stays hermetic in CI.
      - name: Run graphic card-renderer tests
        run: python tests/test_render_cards.py

      # GZH article production: upstream-tool resolution, HTML/image boundary
      # checks, receipt writing and tamper verification. The suites fake the
      # upstream gzh-design tools and inject the runner, so nothing here needs
      # the Easel runtime and no network is touched.
      - name: Run GZH article renderer tests
        run: python tests/test_render_articles.py

      # ASR backcheck: the SiliconFlow adapter contract and the M5 gate that
      # blocks account-bound projects on missing narration evidence. Both suites
      # drive fake transports only -- no provider request is ever made here.
      - name: Run ASR SiliconFlow adapter tests
        run: python tests/test_asr_siliconflow.py

      - name: Run M5 ASR gate tests
        run: python tests/test_m5_asr_gate.py

      # The media suites never make a provider request: they drive
      # tests/fixtures/fake_mmx_cli.py and inject a fake billing transport, so CI
      # needs no MiniMax account and spends no quota.
      - name: Run M2 speech regression tests
        run: python tests/test_minimax_speech.py

      # M2.1 voice cloning. Every test drives a fake transport or a refusal path, so no
      # clone, upload or synthesis can happen here. The one billable clone is a manual,
      # explicitly-confirmed action; this suite exists to prove it cannot happen by
      # accident, which is why the fee-confirmation and one-attempt checks matter more
      # than the happy path.
      - name: Run M2.1 voice-clone regression tests
        run: python tests/test_minimax_voice_clone.py

      # M2.2 two-key clone route. Pure policy: the route decision reads credentials,
      # a billing verdict and a clock, and performs no I/O. So the PAYG key, the
      # cross-key claim and the 168-hour clone lifetime are all testable in CI with
      # no provider account and nothing spent -- which is the only place the
      # "provisioning a key must not look like a working route" invariant can be
      # checked at all, since the real route is blocked on a human action.
      - name: Run M2.2 clone-route regression tests
        run: python tests/test_minimax_clone_route.py

      # The one-time voucher activation authorisation. Pure policy, like the route
      # gate above: it decides whether a CNY 9.9154 charge may be attempted, and the
      # decisive rule is that an UNPROVEN voucher scope refuses no matter how much
      # balance shows. That invariant can only be tested here, because the live path
      # is blocked on a fact no API client can read.
      - name: Run M2.2 voucher-activation regression tests
        run: python tests/test_voucher_activation.py

      # The cash-activation recovery policy. It was added in the #34 rounds without
      # being wired in here, so its 20+ gate assertions only ever ran on one machine.
      - name: Run cash-activation recovery regression tests
        run: python tests/test_cash_activation_recovery.py

      # The native CN T2A adapter and the host-binding audit. Both suites are fully
      # offline: every provider interaction is a fake transport. The decisive
      # assertions are that a non-CN host is refused before the transport is
      # touched, that exactly one request is possible with no retry, that a provider
      # refusal keeps its status code and trace id instead of collapsing into a
      # string, and that neither a refusal nor a public summary can carry the
      # credential.
      - name: Run native T2A adapter regression tests
        run: python tests/test_minimax_native_tts.py

      - name: Run host-binding audit regression tests
        run: python tests/test_host_binding_audit.py

      - name: Run M3 image regression tests
        run: python tests/test_minimax_image.py

      # M4 and M4.5 were merged without these two being wired in, so a green CI run
      # was not evidence that 205 tests passed. A suite that is not executed cannot
      # report a pass, and the gap was invisible precisely because CI looked healthy.
      - name: Run M4 H3 video regression tests
        run: python tests/test_minimax_h3.py

      - name: Run M4.5 media convergence regression tests
        run: python tests/test_media_convergence.py

      # HyperFrames media-use adapter. The suite never reaches a provider: the
      # CLI-driving tests use a fake skill that prints a JSON file the test wrote,
      # and they report SKIP when node is absent rather than pretending to pass.
      # The decisive assertions are fail-closed defaults, no cross-project reuse,
      # no path escape, licensed material never evidence-capable, and generated
      # bytes never importable as licensed external material.
      - name: Run media-use adapter regression tests
        run: python tests/test_media_use_adapter.py

      # M4.6 provider-free: fixtures only, no MiniMax request, no quota. Skips
      # itself when the M4.5 artifacts are absent, which they are on a clean
      # checkout because media binaries are gitignored.
      - name: Run M4.6 enhanced golden infrastructure tests
        run: python tests/test_enhanced_golden.py

      # Source-evidence gitignore policy and the production lock's input
      # reproducibility. Both are pure repository state, so they never skip.
      - name: Run source-evidence gitignore policy tests
        run: python tests/test_gitignore_evidence_policy.py

      # Local skill-execution state: the approval record, consumption ledger and
      # execution receipts. They carry a real Owner identity and request ids, so
      # they are ignored by three exact rules; this suite asserts those rules stay
      # narrow and do not swallow the tracked, auditable project receipts.
      - name: Run local-approval gitignore policy tests
        run: python tests/test_local_approval_gitignore.py

      - name: Run locked-input reproducibility tests
        run: python tests/test_locked_input_reproducibility.py

      # A/B voice variants. Runs on a clean checkout with no gitignored audio present,
      # which is the point: the voice-provenance gates resolve from the tracked Golden
      # fixtures. They used to skip here, so the provenance claims they defend were
      # only ever checked on one machine.
      - name: Run M4.6 A/B voice variant tests
        run: python tests/test_golden_variant_ab.py

      # The Golden voice fixture exception. Asserts the two approved files are tracked
      # and everything else -- other provider output, .verify-tmp, another project's
      # voice assets, and both rendered finals -- stays ignored.
      - name: Run Golden voice media policy tests
        run: python tests/test_golden_voice_assets.py

      # Clones the repository, deletes every host-local input, and resolves the lock,
      # both narrations and B's provider receipt from Git alone. This is the suite that
      # would have caught the host-local provenance before it shipped, and it is the
      # only one that reproduces a second engineer's checkout.
      - name: Run Golden voice clean-checkout rebuildability tests
        run: python tests/test_golden_voice_rebuildability.py

      - name: Run Windows subprocess tests
        run: python tests/test_windows_subprocess.py

      - name: Run Windows path tests
        run: python tests/test_windows_paths.py

      # A rendered clip must not be reused on unverifiable cache provenance, and
      # a compose envelope must be success JSON bound to the file it names.
      - name: Run motion build reliability tests
        run: python tests/test_motion_build_reliability.py

      # Timeline contract, presenter text and review-bundle hash drift.
      - name: Run code-animation consistency tests
        run: python tests/test_code_animation_consistency.py

      # Swapping a clip, a caption, a claim or a source must invalidate an
      # approval; replacing bytes behind an unchanged path must be asset drift.
      - name: Run copy-review integrity tests
        run: python tests/test_copy_review_integrity.py

      # The copy gate must precede audio, and a named provider must never be
      # replaced by edge-tts.
      - name: Run V1 narration-source tests
        run: python tests/test_v1_narration_source.py

      # A clip must reach M5's storyboard, and an unavailable narration source
      # must fail rather than fall back to SAPI.
      - name: Run M5 motion-integration tests
        run: python tests/test_m5_motion_integration.py

      # External B-roll discovery. Both suites are entirely offline: provider
      # responses, DNS answers and loudness measurements are injected. The
      # decisive assertions are that no request happens without an explicit
      # grant, a missing key stays a non-fatal local-only state, 429 carries
      # Retry-After without resubmitting, search responses cache for 24h, a
      # private DNS answer is refused, and registration never fabricates a
      # human rights review. No CI job has a Pexels or Pixabay credential.
      - name: Run stock-media offline tests
        run: python tests/test_stock_media.py

      - name: Run PySceneDetect adapter offline tests
        run: python tests/test_scene_analysis.py

      - name: Run BGM planner offline tests
        run: python tests/test_bgm_planner.py

      # QC layering: a content-evidence WARN must not downgrade decodable media,
      # and no technical/visual PASS may fabricate a human publication approval.
      - name: Run visual-QC quality-state tests
        run: python tests/test_visual_qc_states.py

      # New raw provider IDs, balances and key fingerprints in tracked receipts
      # must fail. Existing exposure is baselined by field path only.
      - name: Run receipt-secret tests
        run: python tests/test_receipt_secrets.py

      # M5 evidence layer. Fully offline: temporary fixtures only, no ffmpeg, no
      # provider. The decisive assertions are that an artifact with permission
      # NONE cannot back a claim even when its quote matches, that a claim whose
      # quote disappeared is reported instead of accepted, and that burned
      # subtitle timestamps stay in ASS centiseconds (a 3-digit fraction silently
      # stretched every cue by an order of magnitude).
      - name: Run M5 evidence regression tests
        run: python tests/test_m5_evidence.py

      # GitHub repository snapshots are pinned to an immutable commit, bounded
      # to selected UTF-8 text, and never become claim-capable without a
      # recognized SPDX licence. The transport is mocked; CI makes no request.
      - name: Run GitHub repository source adapter tests
        run: python tests/test_repo_source_adapter.py

      # The measured real-source gate: seconds of actual material over the
      # rendered file's duration, with overlap unioned and diagrams, cards,
      # generated and motion visuals excluded. Fixture-driven; no render.
      - name: Run real-source duration gate tests
        run: python tests/test_real_source_duration.py

      # One QC release rule: the original overall is kept, account-bound WARN
      # blocks, and neither entry can turn a warning into a pass.
      - name: Run QC verdict tests
        run: python tests/test_qc_verdict.py

      # Production entries refuse to write into a dirty main checkout, except
      # under projects/_local/. Fixture repos only; nothing is rendered.
      - name: Run checkout guard tests
        run: python tests/test_checkout_guard.py

      # Seven VIDEO gates / five GRAPHIC_TEXT gates must pass before a producer
      # runs (production_gates.GATES), and a direct producer call is diagnostic.
      # Also guards QC receipts against a degraded overwrite.
      - name: Run production gates tests
        run: python tests/test_production_gates.py

      # The short motion-sample technical gate: 4-8 s, silent, 1080x1920,
      # H.264/yuv420p, CFR 30, digest-bound. It stops at PENDING_FOUNDER_REVIEW
      # and has no approval or publish switch. Fixture-driven; no render.
      - name: Run motion sample gate tests
        run: python tests/test_motion_sample.py

      # External motion handoff contract: logical project path, digest-bound
      # MP4, pinned MotionClone/0.8.33 pair, project hashes, short source
      # window, internal rights scope and all authority flags false. A record
      # never enters the M5 timeline or grants publication by itself.
      - name: Run motion handoff contract tests
        run: python tests/test_motion_handoff.py

      # The GZH runtime adapter locates and verifies a locally installed
      # workflow and describes its operations. It never executes, drafts or
      # publishes, and the vendored tree stays outside the public repository
      # (Issue #56). Synthetic roots only.
      - name: Run GZH runtime adapter tests
        run: python tests/test_gzh_runtime.py

      # The X editorial adapter: verify the local manual-only account, project
      # and gate code. Never calls the X API, reads a credential, drafts or
      # publishes.
      - name: Run X editorial adapter tests
        run: python tests/test_x_runtime.py

      # Integration boundary only; no runtime download, no external CLI execution,
      # and no network or provider calls on hosted CI runners.
      - name: Run M5 media-use automatic sourcing regression tests
        run: python tests/test_m5_media_use_workflow.py

      # The sample's committed inputs and their receipts. Pure repository state:
      # no adapter, no runtime, no network. Asserts the image and BGM bytes match
      # the receipts that describe them, every import has a tracked receipt, the
      # rights records still pass the gate, and the fixture exception stays narrow.
      - name: Run M5 media-use traceability tests
        run: python tests/test_m5_media_traceability.py

      # The direct ``ingest`` verb copies a file into the project exactly like
      # ``import`` does, so it must apply the same rights policy. The adapter is
      # mocked: this asserts which decision the CLI takes, not how the skill runs.
      - name: Run media-use ingest rights regression tests
        run: python tests/test_media_use_ingest_rights.py

      # Discovery and diagnosis only: these suites build temporary catalogs and
      # never download a runtime or execute a skill.
      - name: Run skill doctor regression tests
        run: python tests/test_skill_doctor.py

      # The installed content skills name code that lives on an unmerged
      # branch. This suite keeps the record of that honest: an unrecorded
      # dangling reference and a recorded reference that has landed are both
      # failures.
      - name: Run skill reference integrity tests
        run: python tests/test_skill_references.py

      # Slice S1 of the content router: the deterministic workflow contract and
      # stage gate. Both suites are self-contained (contract/gate only).
      - name: Run workflow contract tests
        run: python tests/test_workflow_contract.py

      - name: Run workflow stage-gate tests
        run: python tests/test_workflow_gate.py

      # Slice S2 of the content router: the source-candidate contract (stdlib
      # only) and the validators it wires into the gate. The capture plan needs
      # account config and lands in S3.
      - name: Run source candidate tests
        run: python tests/test_source_candidates.py

      # S4 stage policies: audience, duration, copy strategy, local platform
      # limits, manual delivery manifest and visual routing. Stdlib only; no
      # renderer, provider or platform call.
      - name: Run S4 stage-policy tests
        run: python tests/test_s4_stages.py

      # Slices S3/S4 of the content router: the account DNA that declares the
      # sources and the pipeline, the hot-list sources, the router's two
      # entrances (hot-spot discovery and user topic), the draft stage and the
      # bridge that hands an approved draft to M5. Fixture-driven: no network,
      # no provider, no publication.
      - name: Run account DNA tests
        run: python tests/test_account_dna.py

      - name: Run account discovery tests
        run: python tests/test_account_discovery.py

      - name: Run hotspot source tests
        run: python tests/test_hotspot_sources.py

      - name: Run source quality tests
        run: python tests/test_source_quality.py

      - name: Run content router tests
        run: python tests/test_content_router.py

      - name: Run script draft tests
        run: python tests/test_script_draft.py

      - name: Run account route tests
        run: python tests/test_account_route.py

      - name: Run brief-to-M5 bridge tests
        run: python tests/test_brief_to_m5.py

      - name: Run skill router capability regression tests
        run: python tests/test_skill_router_capabilities.py

      # Platform registry: data only. Proves the nine strategy platforms are
      # all mapped, that a split entry still belongs to one strategy platform,
      # and that a placeholder never implies code, publication or metrics.
      - name: Run platform registry tests
        run: python tests/test_platform_registry.py

      # Video delivery line: per-platform shape, blockers and the authorization
      # gate. Proves a horizontal cut, a missing Bilibili category and a Douyin
      # upload all stop in code instead of in a browser form.
      - name: Run video platform delivery tests
        run: python tests/test_video_platforms.py

      # Graphic delivery gate: a packed draft with hard blockers must never reach
      # the browser bridge, and Douyin is refused unconditionally.
      - name: Run graphic delivery gate tests
        run: python tests/test_delivery_gate.py

      # Scan-login adapter for the video uploader. Asserts that every spec
      # platform has a login contract whose cookie stem matches the uploader's
      # own platform name, that only YouTube is proxied, and that a state file
      # is never written without a proven session signal.
      - name: Run uploader login adapter tests
        run: python tests/test_sau_login.py

      # WeChat draft channel: shaping, credential preflight and the read-back
      # check. Offline only — no token, no upload, no credential.
      - name: Run WeChat draft tests
        run: python tests/test_wechat_draft.py

      # Manual metrics import. Offline by construction: the suite asserts the
      # module opens no socket and imports no HTTP client. The decisive cases are
      # that a missing field, a bad hash and a non-numeric metric are refused with
      # every reason named, that metrics are never zero-filled, and that the review
      # receipt cannot modify the script, the QC verdict or production_ready.
      - name: Run manual metrics review tests
        run: python tests/test_manual_metrics.py

      # Bilibili public metrics: DNA gate, BV resolution chain, counter shaping
      # and receipts. Offline — the transport (bilibili-api-python) is imported
      # only under --execute, and a CLI BV is stamped TRANSPORT_SMOKE so a pipe
      # check can never be read as account performance.
      - name: Run bilibili metrics tests
        run: python tests/test_bilibili_metrics.py

      # WeChat data cube channel: official range ceilings, credential preflight
      # that never echoes a value, and receipts that never modify the artefact.
      - name: Run wechat metrics tests
        run: python tests/test_wechat_metrics.py

      # Content Bundle consumption contract: Strategy owns the template, this
      # suite only proves a consumer refuses an incomplete or unsafe record.
      - name: Run content bundle contract tests
        run: python tests/test_content_bundle_contract.py

      # The pinned Easel host is wrapped by a deny-by-default guard. These suites
      # prove the guard refuses publish/credentials before upstream, and that one
      # Bundle can produce independent video and graphic handoffs without
      # transferring approval between them.
      - name: Run Easel host guard tests
        run: python tests/test_easel_host_guard.py

      - name: Run Bundle two-format handoff tests
        run: python tests/test_bundle_two_formats.py

      - name: Run graphic workflow tests
        run: python tests/test_graphic_workflow.py

      - name: Run M5 Bundle handoff tests
        run: python tests/test_m5_bundle_handoff.py

      - name: Run coding-agent driver tests
        run: python tests/test_agent_driver.py

      # Pure decision logic: no adapter, no runtime, no I/O.
      - name: Run skill execution authorization regression tests
        run: python tests/test_skill_execution_authorization.py

      - name: Run managed media-use status wrapper regression tests
        run: python tests/test_skill_execute_status.py

      # Temporary projects on disk, injected executors, no adapter and no runtime.
      - name: Run trusted grant source regression tests
        run: python tests/test_trusted_grant_source.py

      - name: Run execution gate regression tests
        run: python tests/test_execution_gate.py

      # The X editorial track without the vendor bundle. Offline only: no X API,
      # no browser, no vendor tree. The account suite validates the DNA document;
      # the project suite validates the CSV contract and account resolution; the
      # gate suite drives a real record through draft, refusal and manual package;
      # the handoff suite proves a PARTIAL_CONTRACT record is refused by name.
      - name: Run X account DNA regression tests
        run: python tests/test_x_account.py

      - name: Run X project contract regression tests
        run: python tests/test_x_project.py

      - name: Run X post gate regression tests
        run: python tests/test_x_post.py

      - name: Run X contract-handoff regression tests
        run: python tests/test_x_contract_handoff.py

      # The positive path: a complete synthetic record reaches a manual publish
      # package, and every bypass attempt (review_status, ready_for_publish, URL
      # syntax, another account's slug) is refused.
      - name: Run X positive acceptance tests
        run: python tests/test_x_positive_acceptance.py

      # The growth skill imported from #83. Offline only: fixtures, no X access.
      - name: Run X growth contract tests
        run: python tests/test_x_growth_contract.py

      - name: Run X growth engagement tests
        run: python tests/test_x_growth_engagement.py

      - name: Run X growth metrics tests
        run: python tests/test_x_growth_metrics.py

      - name: Run X organic growth operator tests
        run: python tests/test_x_organic_growth.py

      # The end-to-end chain: growth -> enrichment -> gate -> manual package.
      - name: Run X growth integration tests
        run: python tests/test_x_growth_integration.py

      # Path hardening: ids, review files, images and provenance are all data a
      # caller supplies. The suite proves traversal, backslash, drive, UNC and
      # symlink spellings fail closed before anything is read or written.
      - name: Run X path-safety tests
        run: python tests/test_x_path_safety.py

      # The 剪映 handoff: a draft written from the accepted MediaManifest timeline
      # and subtitle cues, inside the project, with no export path at all. Fixture
      # project, real pinned library, JianYing never launched.
      - name: Run 剪映 handoff tests
        run: python tests/test_jianying_handoff.py
      # P0 loop hardening: publication backfill receipts (URL/handle/time/
      # version/confirmer bindings, readback state machine). Fully offline.
      - name: Run publish backfill tests
        run: python tests/test_publish_backfill.py

      # Metric window audit: T+24H/72H/7D coverage, zero-vs-missing split,
      # strict mode. Reads fixture CSVs only; nothing is fetched.
      - name: Run metric window audit tests
        run: python tests/test_metric_windows.py

      # Strategy-vs-ContentOps platform status reconciliation. The fixture
      # matrix stands in for the sibling Strategy checkout.
      - name: Run platform status sync tests
        run: python tests/test_platform_status_sync.py

      # Cross-repo contract: the fixture frozen from Strategy's Bundle
      # template must keep passing the consumer contract.
      - name: Run bundle template fixture tests
        run: python tests/test_bundle_template_fixture.py

      - name: Enforce subprocess policy
        run: python scripts/check_subprocess_policy.py

      - name: Run docs consistency checks
        run: python scripts/check_docs.py

      - name: Run i18n consistency checks
        run: python scripts/check_i18n.py

      - name: Check whitespace
        run: git diff --check --exit-code || exit 1

  repo-policy:
    name: Repo policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The receipt check compares values against the trusted base commit,
          # so the history it needs has to be present.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repo policy check
        run: python scripts/check_repo_policy.py
      # Read-only. Fails when a new untracked experiment directory appears under
      # projects/ outside the baselined list and outside projects/_local/.
      - name: Untracked project check
        run: python scripts/check_untracked_projects.py
      - name: Receipt secret check
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="origin/main"
          fi
          # A force-push or rebase makes github.event.before name a removed
          # commit, and a heavily rewritten history can leave even its parents
          # unreachable. The comparison falls back to origin/main — the same
          # trusted base an empty event value already uses — so the check still
          # runs against a real baseline instead of refusing.
          for _ in 1 2 3 4 5; do
            if git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
              break
            fi
            parent="$(git rev-parse --verify --quiet "$base^" 2>/dev/null || true)"
            if [ -z "$parent" ]; then
              base="origin/main"
              break
            fi
            echo "base $base unreachable; stepping to parent $parent"
            base="$parent"
          done
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null 2>&1; then
            base="origin/main"
          fi
          echo "receipt-secret base: $base"
          python scripts/check_receipt_secrets.py --base "$base"
      - name: Subprocess policy check
        run: python scripts/check_subprocess_policy.py
      - name: Skill reference check
        run: python scripts/check_skill_references.py
      - name: Docs consistency check
        run: python scripts/check_docs.py
      - name: i18n consistency check
        run: python scripts/check_i18n.py
      # Every tracked doc states the date it was verified against; a commit that
      # touches its mapped code after that date fails here. Needs history, which
      # this job already checks out in full (fetch-depth: 0).
      - name: Documentation freshness check
        run: python scripts/check_doc_freshness.py
      # Offline, read-only. Catches append-only ledger drift (CONVERGENCE E7);
      # a pass says nothing about live GitHub state.
      - name: Governance ledger consistency check
        run: python scripts/check_governance_ledger.py
