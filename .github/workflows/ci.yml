name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade pip Pillow

      # ffmpeg was absent on both runners, and the M4 H3 suite plus the M4.5
      # transform tests need it. Installing it here is what turns those skips into
      # real coverage; without it a green run silently meant far less than it
      # appeared to. The step below reports availability precisely so that gap
      # cannot reopen unnoticed.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --limit-output --allow-downgrade
          # The chocolatey shim directory is where ffmpeg.exe lands; adding it
          # explicitly keeps this working whether or not the runner image already
          # has it on PATH.
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\bin" >> $env:GITHUB_PATH
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      # Report what is actually available. A suite that silently skips most of
      # itself looks green while testing nothing, which is how the M3 suite lost
      # half its coverage on a runner without ffmpeg before this step existed.
      - name: Report test dependency availability
        run: python -c "import shutil,sys; print('ffmpeg:', bool(shutil.which('ffmpeg'))); print('ffprobe:', bool(shutil.which('ffprobe'))); import PIL; print('Pillow:', PIL.__version__)"

      - name: Run basic tests
        run: python scripts/test_basic.py

      # The media suites never make a provider request: they drive
      # tests/fixtures/fake_mmx_cli.py and inject a fake billing transport, so CI
      # needs no MiniMax account and spends no quota.
      - name: Run M2 speech regression tests
        run: python tests/test_minimax_speech.py

      - name: Run M3 image regression tests
        run: python tests/test_minimax_image.py

      # M4 and M4.5 were merged without these two being wired in, so a green CI run
      # was not evidence that 205 tests passed. A suite that is not executed cannot
      # report a pass, and the gap was invisible precisely because CI looked healthy.
      - name: Run M4 H3 video regression tests
        run: python tests/test_minimax_h3.py

      - name: Run M4.5 media convergence regression tests
        run: python tests/test_media_convergence.py

      # M4.6 provider-free: fixtures only, no MiniMax request, no quota. Skips
      # itself when the M4.5 artifacts are absent, which they are on a clean
      # checkout because media binaries are gitignored.
      - name: Run M4.6 enhanced golden infrastructure tests
        run: python tests/test_enhanced_golden.py

      # Source-evidence gitignore policy and the production lock's input
      # reproducibility. Both are pure repository state, so they never skip.
      - name: Run source-evidence gitignore policy tests
        run: python tests/test_gitignore_evidence_policy.py

      - name: Run locked-input reproducibility tests
        run: python tests/test_locked_input_reproducibility.py

      # A/B voice variants. Runs on a clean checkout with no gitignored audio present,
      # which is the point: the voice-provenance gates resolve from the tracked Golden
      # fixtures. They used to skip here, so the provenance claims they defend were
      # only ever checked on one machine.
      - name: Run M4.6 A/B voice variant tests
        run: python tests/test_golden_variant_ab.py

      # The Golden voice fixture exception. Asserts the two approved files are tracked
      # and everything else -- other provider output, .verify-tmp, another project's
      # voice assets, and both rendered finals -- stays ignored.
      - name: Run Golden voice media policy tests
        run: python tests/test_golden_voice_assets.py

      # Clones the repository, deletes every host-local input, and resolves the lock,
      # both narrations and B's provider receipt from Git alone. This is the suite that
      # would have caught the host-local provenance before it shipped, and it is the
      # only one that reproduces a second engineer's checkout.
      - name: Run Golden voice clean-checkout rebuildability tests
        run: python tests/test_golden_voice_rebuildability.py

      - name: Run Windows subprocess tests
        run: python tests/test_windows_subprocess.py

      - name: Run Windows path tests
        run: python tests/test_windows_paths.py

      - name: Enforce subprocess policy
        run: python scripts/check_subprocess_policy.py

      - name: Run docs consistency checks
        run: python scripts/check_docs.py

      - name: Run i18n consistency checks
        run: python scripts/check_i18n.py

      - name: Check whitespace
        run: git diff --check --exit-code || exit 1

  repo-policy:
    name: Repo policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repo policy check
        run: python scripts/check_repo_policy.py
      - name: Subprocess policy check
        run: python scripts/check_subprocess_policy.py
      - name: Docs consistency check
        run: python scripts/check_docs.py
      - name: i18n consistency check
        run: python scripts/check_i18n.py
