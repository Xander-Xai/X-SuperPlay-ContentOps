name: CI

on:
  push:
    branches:
      - main
      # Feature branches get the same checks without being merged into main or
      # into an unauthorised parent branch. Dispatch covers a branch whose
      # workflow predates these triggers.
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'security/**'
      - 'docs/**'
      - 'ci/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade pip Pillow

      # ffmpeg was absent on both runners, and the M4 H3 suite plus the M4.5
      # transform tests need it. Installing it here is what turns those skips into
      # real coverage; without it a green run silently meant far less than it
      # appeared to. The step below reports availability precisely so that gap
      # cannot reopen unnoticed.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --limit-output --allow-downgrade
          # The chocolatey shim directory is where ffmpeg.exe lands; adding it
          # explicitly keeps this working whether or not the runner image already
          # has it on PATH.
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\bin" >> $env:GITHUB_PATH
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      # Report what is actually available. A suite that silently skips most of
      # itself looks green while testing nothing, which is how the M3 suite lost
      # half its coverage on a runner without ffmpeg before this step existed.
      - name: Report test dependency availability
        run: python -c "import shutil,sys; print('ffmpeg:', bool(shutil.which('ffmpeg'))); print('ffprobe:', bool(shutil.which('ffprobe'))); import PIL; print('Pillow:', PIL.__version__)"

      - name: Run basic tests
        run: python scripts/test_basic.py

      # The media suites never make a provider request: they drive
      # tests/fixtures/fake_mmx_cli.py and inject a fake billing transport, so CI
      # needs no MiniMax account and spends no quota.
      - name: Run M2 speech regression tests
        run: python tests/test_minimax_speech.py

      # M2.1 voice cloning. Every test drives a fake transport or a refusal path, so no
      # clone, upload or synthesis can happen here. The one billable clone is a manual,
      # explicitly-confirmed action; this suite exists to prove it cannot happen by
      # accident, which is why the fee-confirmation and one-attempt checks matter more
      # than the happy path.
      - name: Run M2.1 voice-clone regression tests
        run: python tests/test_minimax_voice_clone.py

      # M2.2 two-key clone route. Pure policy: the route decision reads credentials,
      # a billing verdict and a clock, and performs no I/O. So the PAYG key, the
      # cross-key claim and the 168-hour clone lifetime are all testable in CI with
      # no provider account and nothing spent -- which is the only place the
      # "provisioning a key must not look like a working route" invariant can be
      # checked at all, since the real route is blocked on a human action.
      - name: Run M2.2 clone-route regression tests
        run: python tests/test_minimax_clone_route.py

      # The one-time voucher activation authorisation. Pure policy, like the route
      # gate above: it decides whether a CNY 9.9154 charge may be attempted, and the
      # decisive rule is that an UNPROVEN voucher scope refuses no matter how much
      # balance shows. That invariant can only be tested here, because the live path
      # is blocked on a fact no API client can read.
      - name: Run M2.2 voucher-activation regression tests
        run: python tests/test_voucher_activation.py

      # The cash-activation recovery policy. It was added in the #34 rounds without
      # being wired in here, so its 20+ gate assertions only ever ran on one machine.
      - name: Run cash-activation recovery regression tests
        run: python tests/test_cash_activation_recovery.py

      # The native CN T2A adapter and the host-binding audit. Both suites are fully
      # offline: every provider interaction is a fake transport. The decisive
      # assertions are that a non-CN host is refused before the transport is
      # touched, that exactly one request is possible with no retry, that a provider
      # refusal keeps its status code and trace id instead of collapsing into a
      # string, and that neither a refusal nor a public summary can carry the
      # credential.
      - name: Run native T2A adapter regression tests
        run: python tests/test_minimax_native_tts.py

      - name: Run host-binding audit regression tests
        run: python tests/test_host_binding_audit.py

      - name: Run M3 image regression tests
        run: python tests/test_minimax_image.py

      # M4 and M4.5 were merged without these two being wired in, so a green CI run
      # was not evidence that 205 tests passed. A suite that is not executed cannot
      # report a pass, and the gap was invisible precisely because CI looked healthy.
      - name: Run M4 H3 video regression tests
        run: python tests/test_minimax_h3.py

      - name: Run M4.5 media convergence regression tests
        run: python tests/test_media_convergence.py

      # HyperFrames media-use adapter. The suite never reaches a provider: the
      # CLI-driving tests use a fake skill that prints a JSON file the test wrote,
      # and they report SKIP when node is absent rather than pretending to pass.
      # The decisive assertions are fail-closed defaults, no cross-project reuse,
      # no path escape, licensed material never evidence-capable, and generated
      # bytes never importable as licensed external material.
      - name: Run media-use adapter regression tests
        run: python tests/test_media_use_adapter.py

      # M4.6 provider-free: fixtures only, no MiniMax request, no quota. Skips
      # itself when the M4.5 artifacts are absent, which they are on a clean
      # checkout because media binaries are gitignored.
      - name: Run M4.6 enhanced golden infrastructure tests
        run: python tests/test_enhanced_golden.py

      # Source-evidence gitignore policy and the production lock's input
      # reproducibility. Both are pure repository state, so they never skip.
      - name: Run source-evidence gitignore policy tests
        run: python tests/test_gitignore_evidence_policy.py

      # Local skill-execution state: the approval record, consumption ledger and
      # execution receipts. They carry a real Owner identity and request ids, so
      # they are ignored by three exact rules; this suite asserts those rules stay
      # narrow and do not swallow the tracked, auditable project receipts.
      - name: Run local-approval gitignore policy tests
        run: python tests/test_local_approval_gitignore.py

      - name: Run locked-input reproducibility tests
        run: python tests/test_locked_input_reproducibility.py

      # A/B voice variants. Runs on a clean checkout with no gitignored audio present,
      # which is the point: the voice-provenance gates resolve from the tracked Golden
      # fixtures. They used to skip here, so the provenance claims they defend were
      # only ever checked on one machine.
      - name: Run M4.6 A/B voice variant tests
        run: python tests/test_golden_variant_ab.py

      # The Golden voice fixture exception. Asserts the two approved files are tracked
      # and everything else -- other provider output, .verify-tmp, another project's
      # voice assets, and both rendered finals -- stays ignored.
      - name: Run Golden voice media policy tests
        run: python tests/test_golden_voice_assets.py

      # Clones the repository, deletes every host-local input, and resolves the lock,
      # both narrations and B's provider receipt from Git alone. This is the suite that
      # would have caught the host-local provenance before it shipped, and it is the
      # only one that reproduces a second engineer's checkout.
      - name: Run Golden voice clean-checkout rebuildability tests
        run: python tests/test_golden_voice_rebuildability.py

      - name: Run Windows subprocess tests
        run: python tests/test_windows_subprocess.py

      - name: Run Windows path tests
        run: python tests/test_windows_paths.py

      # New raw provider IDs, balances and key fingerprints in tracked receipts
      # must fail. Existing exposure is baselined by field path only.
      - name: Run receipt-secret tests
        run: python tests/test_receipt_secrets.py

      # M5 evidence layer. Fully offline: temporary fixtures only, no ffmpeg, no
      # provider. The decisive assertions are that an artifact with permission
      # NONE cannot back a claim even when its quote matches, that a claim whose
      # quote disappeared is reported instead of accepted, and that burned
      # subtitle timestamps stay in ASS centiseconds (a 3-digit fraction silently
      # stretched every cue by an order of magnitude).
      - name: Run M5 evidence regression tests
        run: python tests/test_m5_evidence.py

      # Integration boundary only; no runtime download, no external CLI execution,
      # and no network or provider calls on hosted CI runners.
      - name: Run M5 media-use automatic sourcing regression tests
        run: python tests/test_m5_media_use_workflow.py

      # The sample's committed inputs and their receipts. Pure repository state:
      # no adapter, no runtime, no network. Asserts the image and BGM bytes match
      # the receipts that describe them, every import has a tracked receipt, the
      # rights records still pass the gate, and the fixture exception stays narrow.
      - name: Run M5 media-use traceability tests
        run: python tests/test_m5_media_traceability.py

      # The direct ``ingest`` verb copies a file into the project exactly like
      # ``import`` does, so it must apply the same rights policy. The adapter is
      # mocked: this asserts which decision the CLI takes, not how the skill runs.
      - name: Run media-use ingest rights regression tests
        run: python tests/test_media_use_ingest_rights.py

      # Discovery and diagnosis only: these suites build temporary catalogs and
      # never download a runtime or execute a skill.
      - name: Run skill doctor regression tests
        run: python tests/test_skill_doctor.py

      # The installed content skills name code that lives on an unmerged
      # branch. This suite keeps the record of that honest: an unrecorded
      # dangling reference and a recorded reference that has landed are both
      # failures.
      - name: Run skill reference integrity tests
        run: python tests/test_skill_references.py

      # Slice S1 of the content router: the deterministic workflow contract and
      # stage gate. Both suites are self-contained (contract/gate only).
      - name: Run workflow contract tests
        run: python tests/test_workflow_contract.py

      - name: Run workflow stage-gate tests
        run: python tests/test_workflow_gate.py

      # Slice S2 of the content router: the source-candidate contract (stdlib
      # only) and the validators it wires into the gate. The capture plan needs
      # account config and lands in S3.
      - name: Run source candidate tests
        run: python tests/test_source_candidates.py

      - name: Run skill router capability regression tests
        run: python tests/test_skill_router_capabilities.py

      - name: Run X organic growth offline contract tests
        run: python tests/test_x_organic_growth.py

      - name: Run X engagement brief tests
        run: python tests/test_x_growth_engagement.py

      - name: Run X compatibility contract tests
        run: python tests/test_x_growth_contract.py

      - name: Run X weekly metrics tests
        run: python tests/test_x_growth_metrics.py

      # Pure decision logic: no adapter, no runtime, no I/O.
      - name: Run skill execution authorization regression tests
        run: python tests/test_skill_execution_authorization.py

      - name: Run managed media-use status wrapper regression tests
        run: python tests/test_skill_execute_status.py

      # Temporary projects on disk, injected executors, no adapter and no runtime.
      - name: Run trusted grant source regression tests
        run: python tests/test_trusted_grant_source.py

      - name: Run execution gate regression tests
        run: python tests/test_execution_gate.py

      # The X editorial track without the vendor bundle. Offline only: no X API,
      # no browser, no vendor tree. The account suite validates the DNA document;
      # the project suite validates the CSV contract and account resolution; the
      # gate suite drives a real record through draft, refusal and manual package;
      # the handoff suite proves a PARTIAL_CONTRACT record is refused by name.
      - name: Run X account DNA regression tests
        run: python tests/test_x_account.py

      - name: Run X project contract regression tests
        run: python tests/test_x_project.py

      - name: Run X post gate regression tests
        run: python tests/test_x_post.py

      - name: Run X contract-handoff regression tests
        run: python tests/test_x_contract_handoff.py

      # The positive path: a complete synthetic record reaches a manual publish
      # package, and every bypass attempt (review_status, ready_for_publish, URL
      # syntax, another account's slug) is refused.
      - name: Run X positive acceptance tests
        run: python tests/test_x_positive_acceptance.py

      # The growth skill imported from #83. Offline only: fixtures, no X access.
      - name: Run X growth contract tests
        run: python tests/test_x_growth_contract.py

      - name: Run X growth engagement tests
        run: python tests/test_x_growth_engagement.py

      - name: Run X growth metrics tests
        run: python tests/test_x_growth_metrics.py

      - name: Run X organic growth operator tests
        run: python tests/test_x_organic_growth.py

      # The end-to-end chain: growth -> enrichment -> gate -> manual package.
      - name: Run X growth integration tests
        run: python tests/test_x_growth_integration.py

      # Path hardening: ids, review files, images and provenance are all data a
      # caller supplies. The suite proves traversal, backslash, drive, UNC and
      # symlink spellings fail closed before anything is read or written.
      - name: Run X path-safety tests
        run: python tests/test_x_path_safety.py

      - name: Enforce subprocess policy
        run: python scripts/check_subprocess_policy.py

      - name: Run docs consistency checks
        run: python scripts/check_docs.py

      - name: Run i18n consistency checks
        run: python scripts/check_i18n.py

      - name: Check whitespace
        run: git diff --check --exit-code || exit 1

  repo-policy:
    name: Repo policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The receipt check compares values against the trusted base commit,
          # so the history it needs has to be present.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repo policy check
        run: python scripts/check_repo_policy.py
      - name: Receipt secret check
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="origin/main"
          fi
          python scripts/check_receipt_secrets.py --base "$base"
      - name: Subprocess policy check
        run: python scripts/check_subprocess_policy.py
      - name: Skill reference check
        run: python scripts/check_skill_references.py
      - name: Docs consistency check
        run: python scripts/check_docs.py
      - name: i18n consistency check
        run: python scripts/check_i18n.py
