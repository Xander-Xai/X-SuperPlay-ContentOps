name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run basic tests
        run: python scripts/test_basic.py

      - name: Run docs consistency checks
        run: python scripts/check_docs.py

      - name: Check whitespace
        run: git diff --check --exit-code || exit 1

  repo-policy:
    name: Repo policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repo policy check
        run: python scripts/check_repo_policy.py
        if: runner.os == 'Linux'
