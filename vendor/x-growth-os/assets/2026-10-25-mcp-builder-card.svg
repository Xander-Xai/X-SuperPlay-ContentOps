<title id="title">MCP tools agents can actually use</title>
<desc id="desc">A conceptual four-step checklist inspired by Anthropic's mcp-builder Skill: discover clear tool names, respond with focused results, recover using actionable errors, and verify with real task evaluations. The source recommends 10 verifiable evaluation questions.</desc>
