<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Parsing is not approval</title>
<desc id="desc">An editorial diagram showing that an invoice automation workflow needs source documents, traceable evidence, and human review for exceptions. It is a conceptual design, not a production screenshot.</desc>
<rect width="1600" height="900" fill="#F7F7F3"/>
<path d="M86 78 H1514" stroke="#B6BDB7" stroke-width="2"/>
<text x="89" y="121" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#4C6359">FIELD NOTE  /  AI OPERATIONS</text>
<text x="88" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="83" font-weight="700" fill="#152B24">PARSING IS NOT</text>
<text x="88" y="354" font-family="DejaVu Sans,Arial,sans-serif" font-size="83" font-weight="700" fill="#152B24">APPROVAL<tspan fill="#C05D3D">.</tspan></text>
<text x="91" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#45564E">A useful invoice workflow connects each decision to evidence.</text>
<path d="M88 465 H1511" stroke="#B6BDB7" stroke-width="2"/>
<text x="91" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#5F7268">01   SOURCE</text>
<text x="598" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#5F7268">02   EVIDENCE</text>
<text x="1114" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#5F7268">03   REVIEW</text>
