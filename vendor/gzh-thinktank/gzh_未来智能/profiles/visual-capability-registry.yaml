schema_version: 1
contract: visual-capability-registry-v1
scan:
  roots:
    - skills/
  skill_filename: SKILL.md
  skill_file_count: 42
  scanned_at: "2026-08-12"
  inventory: reports/skill-inventory-current.json

# The director evaluates every listed capability during planning, but only
# capabilities with execution_status=integrated may be selected as a primary
# renderer. Advisory capabilities remain visible as future/optional candidates.
# Planning/quality contracts are evaluated beside renderers but are not
# image backends. Keeping them explicit prevents a style brief from being
# mistaken for an executable renderer.
planning_contracts:
  - contract_id: visual-depth-contract-v1
    execution_status: integrated
    adapter: scripts/visual_depth_qa.py
    editable_source: json
    deterministic: true
    fallback: structural-qa-block
    note: "解释深度合同；不是图片 renderer。检查 reader question、typed relations、claim/evidence 和 fallback"
  - contract_id: art-direction-v1
    execution_status: integrated
    adapter: scripts/build_art_direction.py
    editable_source: yaml
    deterministic: true
    fallback: account-art-direction
  - contract_id: visual-taste-review-v1
    execution_status: integrated
    adapter: scripts/visual_taste_review.py
    editable_source: json
    deterministic: true
    review_mode: warning-first
    fallback: no-aesthetic-block
  - contract_id: visual-aesthetic-contract-v1
    execution_status: integrated
    adapter: scripts/visual_aesthetic_qa.py
    editable_source: svg
    deterministic: true
    fallback: visual-aesthetic-block
    note: "客观图面卫生合同；不是 renderer。检查箭头方向、标签/节点/连线碰撞、safe frame 与 footer 裁切"
  - contract_id: visual-reader-test-v1
    execution_status: integrated
    adapter: scripts/visual_reader_test.py
    editable_source: json
    deterministic: true
    fallback: pending-human
    note: "固定读者问题与评分回执；默认 pending-human，不冒充真人理解或审美批准"

