name: Signal Radar
description: AI哨兵专用的编辑部雷达风格，强调信号、证据和快速判断

variables:
  primary-color: "#E05A2A"
  bg-accent-color: "#FFF1E8"
  text-color: "#252525"
  text-light: "#5C6268"
  text-muted: "#8A8F93"
  bg-light: "#F6F1EA"
  border-color: "#E7DED5"
  link-color: "#1B6F8A"
  font-size: "16px"
  font-family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif"
  line-height: "1.86"
  paragraph-spacing: "1.25em"

styles:
  h1: "font-size:24px; line-height:1.35; font-weight:800; color:#252525; letter-spacing:0.5px; padding:0 0 12px; margin-bottom:26px; border-bottom:3px solid #E05A2A;"
  h2: "font-size:19px; line-height:1.45; font-weight:800; color:#252525; padding:8px 0 8px 12px; margin:2.2em 0 0.9em; border-left:5px solid #E05A2A; background:#FFF8F3;"
  h3: "font-size:16px; line-height:1.55; font-weight:700; color:#1B6F8A; padding-bottom:4px; margin:1.5em 0 0.65em; border-bottom:1px solid #B9D9E2;"
  h4: "font-size:15px; font-weight:700; color:#252525; margin:1.2em 0 0.6em;"
  p: "font-size:16px; line-height:1.86; color:#252525; margin:1.25em 0; letter-spacing:0.2px;"
  strong: "color:#B94720; font-weight:800;"
  em: "font-style:normal; color:#1B6F8A; background:#EAF6F8; padding:0 3px;"
  a: "color:#1B6F8A; text-decoration:none; border-bottom:1px solid #79B9C8;"
  blockquote: "border-left:4px solid #1B6F8A; background:#EEF7F8; padding:14px 16px; margin:1.3em 0; color:#3D5058; border-radius:0 8px 8px 0;"
  ul: "padding-left:20px; margin:0.7em 0;"
  ol: "padding-left:20px; margin:0.7em 0;"
  li: "margin-bottom:8px; line-height:1.8; color:#252525;"
  hr: "border:none; height:2px; background:#E7DED5; margin:2.2em 0;"
  img: "max-width:100%; height:auto; border-radius:8px; display:block; margin:20px auto; box-shadow:0 8px 22px rgba(37,37,37,0.10);"
  figcaption: "text-align:center; font-size:12px; color:#8A8F93; margin-top:6px;"
  code: "color:#B94720; background:#FFF1E8; padding:2px 6px; border-radius:4px; font-size:90%;"
  pre: "background:#202A30; color:#D9F0F1; padding:16px; border-radius:8px; font-size:13px; line-height:1.75; overflow-x:auto; box-shadow:0 8px 24px rgba(32,42,48,0.18);"
  strong-color: "#B94720"
