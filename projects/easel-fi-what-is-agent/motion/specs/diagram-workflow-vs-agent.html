<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0F1117; --surface:#161A22; --panel:#1C2230; --text:#F5F7FA; --muted:#8B95A5; --line:#3A4456; --accent:#38BDF8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body { background:var(--bg); color:var(--text); font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
  .card { width:1080px; height:1920px; padding:84px 80px; display:flex; flex-direction:column; }
  .kicker { color:var(--muted); font-size:26px; letter-spacing:.16em; }
  .rule { height:2px; margin-top:26px; background:var(--accent); }
  h1 { margin-top:80px; font-size:100px; line-height:1.12; font-weight:300; letter-spacing:-.035em; }
  h1 b { color:var(--accent); font-weight:400; }
  .panel { margin-top:60px; padding:42px 38px; min-height:310px; background:var(--surface); border:1px solid var(--line); }
  .panel.agent { margin-top:34px; min-height:440px; border-color:var(--accent); }
  .label { color:var(--muted); font-size:28px; letter-spacing:.12em; }
  .label b { color:var(--text); font-weight:500; }
  .flow { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:48px; }
  .box { min-width:190px; padding:28px 18px; text-align:center; background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:32px; }
  .box.fixed { border-color:var(--accent); color:var(--accent); }
  .arrow { color:var(--accent); font-size:42px; font-weight:300; }
  .note { margin-top:28px; color:var(--muted); font-size:28px; line-height:1.45; }
  .loop { margin-top:42px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .step { padding:28px 24px; background:var(--panel); border:1px solid var(--line); font-size:34px; }
  .step b { display:block; margin-bottom:8px; color:var(--muted); font-size:22px; letter-spacing:.08em; font-weight:400; }
  .return { grid-column:1 / span 2; padding-top:8px; color:var(--accent); text-align:center; font-size:30px; letter-spacing:.05em; }
  .takeaway { margin-top:30px; padding:24px 28px; border-top:1px solid var(--line); color:var(--text); font-size:30px; text-align:center; }
  .takeaway b { color:var(--accent); font-weight:400; }
  .credit { margin-top:56px; color:var(--muted); font-size:22px; line-height:1.5; }
  .credit b { color:var(--text); font-weight:500; }
</style>
</head>
<body>
  <main class="card">
    <div class="kicker">AGENT · 结构对照</div>
    <div class="rule"></div>
    <h1><b>工作流</b>走固定路径，<br><b>Agent</b>自己决定下一步。</h1>

    <section class="panel">
      <div class="label"><b>WORKFLOW</b> · 路径预先写好</div>
      <div class="flow">
        <div class="box">输入</div><div class="arrow">→</div>
        <div class="box fixed">固定步骤</div><div class="arrow">→</div>
        <div class="box">输出</div>
      </div>
      <div class="note">代码决定顺序、分支和停止点。</div>
    </section>

    <section class="panel agent">
      <div class="label"><b>AGENT</b> · 模型在循环中决策</div>
      <div class="loop">
        <div class="step"><b>01 · 目标</b>看当前状态</div>
        <div class="step"><b>02 · 决策</b>选下一步动作</div>
        <div class="step"><b>03 · 工具</b>执行并拿回结果</div>
        <div class="step"><b>04 · 观察</b>更新理解</div>
        <div class="return">↺ 带着新结果，回到「决策」</div>
      </div>
      <div class="takeaway">关键不在“有没有模型”，而在<b>谁决定路径</b>。</div>
    </section>

    <div class="credit">结构重绘自 <b>Anthropic《Building effective agents》</b>（2024-12）。<br>workflow：预定义代码路径；agent：模型动态决定过程与工具使用。</div>
  </main>
</body>
</html>
