<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#f4f6f8"/>
  <rect x="0" y="0" width="1920" height="16" fill="#e35d45"/>
  <text x="112" y="142" font-family="sans-serif" font-size="30" fill="#e35d45" letter-spacing="4">ENGINEERING SAMPLE / 03</text>
  <text x="112" y="242" font-family="sans-serif" font-size="68" font-weight="700" fill="#182333">Canvas and source geometry both matter.</text>
  <text x="112" y="312" font-family="sans-serif" font-size="34" fill="#536273">A 1920x1080 export is not enough if each shot is still portrait.</text>
  <rect x="112" y="390" width="880" height="470" rx="24" fill="#ffffff" stroke="#d8dee5" stroke-width="3"/>
  <text x="160" y="458" font-family="sans-serif" font-size="24" fill="#6c7785" letter-spacing="3">FRAME GEOMETRY</text>
  <rect x="174" y="504" width="640" height="300" rx="12" fill="#dceafa" stroke="#3d78b5" stroke-width="5"/>
  <text x="410" y="670" font-family="sans-serif" font-size="46" font-weight="700" fill="#182333">16 : 9</text>
  <text x="450" y="844" font-family="sans-serif" font-size="28" fill="#536273">1920 wide</text>
  <text x="844" y="662" font-family="sans-serif" font-size="28" fill="#536273">1080 tall</text>
  <rect x="1050" y="390" width="758" height="470" rx="24" fill="#182333"/>
  <text x="1098" y="458" font-family="sans-serif" font-size="24" fill="#9bd0ff" letter-spacing="3">SOURCE: scripts/qc_video.py</text>
  <text x="1098" y="548" font-family="monospace" font-size="22" fill="#ffffff">if resolution != "1920x1080":</text>
  <text x="1098" y="592" font-family="monospace" font-size="22" fill="#ffffff">  refuse unsupported canvas</text>
  <text x="1098" y="662" font-family="monospace" font-size="22" fill="#8ee0bc">native source check</text>
  <text x="1098" y="706" font-family="monospace" font-size="22" fill="#8ee0bc">requires every shot to probe</text>
  <text x="1098" y="750" font-family="monospace" font-size="22" fill="#8ee0bc">as landscape 16:9 media</text>
</svg>
