  <rect x="1364" y="410" width="444" height="260" rx="24" fill="#182333"/>
  <text x="1416" y="488" font-family="sans-serif" font-size="24" fill="#9bd0ff" letter-spacing="3">03 / EASEL</text>
  <text x="1416" y="564" font-family="sans-serif" font-size="38" font-weight="700" fill="#ffffff">Compose</text>
  <text x="1416" y="624" font-family="monospace" font-size="26" fill="#8ee0bc">1920x1080</text>
  <rect x="112" y="738" width="1696" height="120" rx="20" fill="#ffffff" stroke="#d8dee5" stroke-width="2"/>
  <text x="152" y="812" font-family="sans-serif" font-size="23" fill="#6c7785" letter-spacing="2">PINNED ADAPTER</text>
