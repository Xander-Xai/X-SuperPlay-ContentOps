  <text x="112" y="142" font-family="sans-serif" font-size="30" fill="#e35d45" letter-spacing="4">ENGINEERING SAMPLE / 02</text>
  <text x="112" y="242" font-family="sans-serif" font-size="68" font-weight="700" fill="#182333">The storyboard drives the canvas.</text>
  <text x="112" y="312" font-family="sans-serif" font-size="34" fill="#536273">Three horizontal steps, given room to breathe across the frame.</text>
  <rect x="112" y="410" width="470" height="260" rx="24" fill="#ffffff" stroke="#cbd7e5" stroke-width="3"/>
  <text x="164" y="488" font-family="sans-serif" font-size="24" fill="#6c7785" letter-spacing="3">01 / M5</text>
  <text x="164" y="564" font-family="sans-serif" font-size="38" font-weight="700" fill="#182333">Project target</text>
  <text x="164" y="624" font-family="monospace" font-size="26" fill="#e35d45">1920x1080</text>
  <path d="M600 540 H710" stroke="#e35d45" stroke-width="10"/>
  <path d="M710 540 l-24 -18 v36 z" fill="#e35d45"/>
  <rect x="738" y="410" width="470" height="260" rx="24" fill="#ffffff" stroke="#cbd7e5" stroke-width="3"/>
  <text x="790" y="488" font-family="sans-serif" font-size="24" fill="#6c7785" letter-spacing="3">02 / STORYBOARD</text>
  <text x="790" y="564" font-family="sans-serif" font-size="38" font-weight="700" fill="#182333">Declared size</text>
  <text x="790" y="624" font-family="monospace" font-size="26" fill="#e35d45">size: 1920x1080</text>
