<!doctype html>
<html lang="zh-CN" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f2f4f5;
        --ink: #0a1f3d;
        --accent: #315d93;
        --muted: #5f6d78;
        --mono: "Cascadia Mono", "Noto Sans Mono CJK SC", monospace;
        --serif: "Noto Serif SC", "Songti SC", Georgia, serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root {
        position: relative; width: 1080px; height: 1920px;
        padding: 96px 86px; background: var(--paper); color: var(--ink); overflow: hidden;
      }
      #root::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .06;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");
        mix-blend-mode: multiply;
      }
      .topline {
        display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 1.5px solid var(--ink); padding-bottom: 16px;
        font-family: var(--mono); font-size: 23px; letter-spacing: .18em; color: var(--muted);
      }
      .topline .tag { color: var(--accent); }
      #rule {
        position: absolute; left: 86px; top: 430px; width: 908px; height: 6px;
        background: var(--accent); transform-origin: left center;
      }
      #kicker {
        position: absolute; left: 86px; top: 480px;
        font-family: var(--mono); font-size: 28px; letter-spacing: .24em;
        color: var(--accent); opacity: 0;
      }
      .stat {
        position: absolute; left: 80px; top: 540px;
        display: flex; align-items: baseline; gap: 26px;
      }
      #num {
        font-family: var(--serif); font-size: 420px; line-height: .86;
        font-weight: 300; letter-spacing: -.07em; color: var(--accent);
      }
      #den { font-family: var(--mono); font-size: 62px; color: var(--muted); opacity: 0; }
      #sub {
        position: absolute; left: 86px; top: 1140px;
        font-family: var(--serif); font-size: 58px; line-height: 1.3;
        font-weight: 400; opacity: 0;
      }
      #meta {
        position: absolute; left: 86px; top: 1290px;
        font-family: var(--mono); font-size: 26px; letter-spacing: .08em;
        color: var(--muted); opacity: 0;
      }
      #stamp {
        position: absolute; right: 86px; bottom: 220px;
        border: 5px double var(--accent); color: var(--accent);
        padding: 22px 30px; transform: rotate(-5deg); opacity: 0;
        font-family: var(--mono); font-size: 24px; line-height: 1.5;
        letter-spacing: .16em; text-align: center;
      }
      #stamp strong { display: block; font-size: 32px; letter-spacing: .1em; }
      #foot {
        position: absolute; left: 86px; right: 86px; bottom: 90px;
        display: flex; justify-content: space-between;
        border-top: 1.5px solid var(--ink); padding-top: 16px;
        font-family: var(--mono); font-size: 22px; letter-spacing: .1em;
        color: var(--muted); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div class="topline">
        <span class="tag">[ 未来智能 · 证据 ]</span>
        <span>PINNED v0.2.1</span>
      </div>
      <div id="rule" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="kicker" class="clip" data-start="0" data-duration="4" data-track-index="1">HASH VERIFICATION</div>
      <div class="stat clip" data-start="0" data-duration="4" data-track-index="2">
        <div id="num">0</div>
        <div id="den">/ 982</div>
      </div>
      <h1 id="sub" class="clip" data-start="0" data-duration="4" data-track-index="3">
        文件哈希，<br />与上游 tag 完全一致。
      </h1>
      <div id="meta" class="clip" data-start="0" data-duration="4" data-track-index="4">
        v0.2.1 · 3fe2d99 · 982 / 982
      </div>
      <div id="stamp" class="clip" data-start="0" data-duration="4" data-track-index="5">
        <strong>VERIFIED</strong>982 / 982
      </div>
      <div id="foot" class="clip" data-start="0" data-duration="4" data-track-index="6">
        <span>未来智能 / 工程</span><span>03 / 06</span>
      </div>
    </div>
    <script>
      const counter = { v: 0 };
      const num = document.querySelector("#num");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.10);
      tl.fromTo("#kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.20);
      tl.to(counter, {
        v: 982, duration: 1.8, ease: "power2.out",
        onUpdate: () => { num.textContent = Math.round(counter.v); },
      }, 0.30);
      tl.fromTo("#den", { opacity: 0 }, { opacity: 1, duration: 0.40, ease: "power2.out" }, 0.55);
      tl.fromTo("#sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 1.20);
      tl.fromTo("#meta", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.60);
      tl.fromTo("#stamp", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.90);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 2.10);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
