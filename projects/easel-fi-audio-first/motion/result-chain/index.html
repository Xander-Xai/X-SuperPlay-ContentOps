<!doctype html>
<html lang="zh-CN" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans CJK SC"; src: local("Noto Sans CJK SC"); }
      @font-face { font-family: "Cascadia Mono"; src: local("Cascadia Mono"); }
      @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
      :root {
        --base: #0f1117; --surface: #161a22; --ink: #f5f7fa;
        --muted: #8b95a5; --accent: #38bdf8; --line: #2a3240;
        --sans: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        --mono: "Cascadia Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--base); }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--base); color: var(--ink); overflow: hidden; }
      #scene { position: absolute; inset: 0; width: 1080px; height: 1920px; transform-origin: 50% 42%; }
      #grain { position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: .05;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
      .topline { position: absolute; left: 86px; right: 86px; top: 96px; display: flex;
        justify-content: space-between; font-family: var(--mono); font-size: 28px;
        letter-spacing: .18em; color: var(--muted); }
      .topline .tag { color: var(--accent); }
      .topline span { white-space: nowrap; }
      #rule { position: absolute; left: 86px; top: 150px; width: 908px; height: 2px;
        background: var(--accent); transform-origin: left center; }
      h1 { position: absolute; left: 86px; top: 210px; width: 908px; font-family: var(--sans);
        font-size: 84px; line-height: 1.22; font-weight: 300; letter-spacing: -.02em; opacity: 0; }
      #spine { position: absolute; left: 108px; top: 520px; width: 3px; height: 0;
        background: var(--accent); border-radius: 2px; }
      .row { position: absolute; left: 140px; width: 854px; background: var(--surface);
        border: 1px solid var(--line); border-radius: 12px; padding: 28px 34px;
        display: flex; justify-content: space-between; align-items: baseline; opacity: 0; }
      .row .k { font-family: var(--mono); font-size: 28px; letter-spacing: .12em; color: var(--muted); }
      .row .v { font-family: var(--sans); font-size: 54px; font-weight: 300; }
      .row.hl { border-color: var(--accent); }
      .row.hl .v { color: var(--accent); }
      #r1 { top: 540px; } #r2 { top: 690px; } #r3 { top: 840px; } #r4 { top: 990px; }
      #note { position: absolute; left: 86px; top: 1160px; font-family: var(--sans);
        font-size: 36px; line-height: 1.5; color: var(--muted); opacity: 0; }
      #foot { position: absolute; left: 86px; right: 86px; top: 1390px;
        display: flex; justify-content: space-between; border-top: 1px solid var(--line);
        padding-top: 16px; font-family: var(--mono); font-size: 28px;
        letter-spacing: .1em; color: var(--muted); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5"
         data-width="1080" data-height="1920">
      <div id="grain"></div>
      <div id="scene">
      <div id="topline" class="topline clip" data-start="0" data-duration="5" data-track-index="0">
        <span class="tag">[ RESULT ]</span><span>REPRODUCIBLE</span>
      </div>
      <div id="rule" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <h1 id="head" class="clip" data-start="0" data-duration="5" data-track-index="1">结果可复算。</h1>
      <div id="spine" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
      <div id="r1" class="row clip" data-start="0" data-duration="5" data-track-index="3">
        <span class="k">PLACEMENTS</span><span class="v" id="v1">0</span>
      </div>
      <div id="r2" class="row clip" data-start="0" data-duration="5" data-track-index="3">
        <span class="k">VIEWS</span><span class="v" id="v2">0</span>
      </div>
      <div id="r3" class="row hl clip" data-start="0" data-duration="5" data-track-index="3">
        <span class="k">最长冻结</span><span class="v"><span id="v3">0.00</span> s</span>
      </div>
      <div id="r4" class="row hl clip" data-start="0" data-duration="5" data-track-index="3">
        <span class="k">QC</span><span class="v" id="v4">—</span>
      </div>
      <div id="note" class="clip" data-start="0" data-duration="5" data-track-index="4">
        同一份收据，换台机器也能重数。
      </div>
      <div id="foot" class="clip" data-start="0" data-duration="5" data-track-index="5">
        <span>qc-report.json</span><span>P05 / 05</span>
      </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#scene", { scale: 1 }, { scale: 1.035, duration: 5, ease: "none" }, 0);
      const c1 = { v: 0 }, c2 = { v: 0 }, c3 = { v: 0 };
      const e1 = document.querySelector("#v1");
      const e2 = document.querySelector("#v2");
      const e3 = document.querySelector("#v3");

      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power3.out" }, .05);
      tl.fromTo("#head", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, .25);
      tl.to("#spine", { height: 560, duration: .8, ease: "power2.inOut" }, .6);
      tl.fromTo("#r1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .32, ease: "power3.out" }, .7);
      tl.to(c1, { v: 8, duration: .6, ease: "power2.out",
        onUpdate: () => { e1.textContent = Math.round(c1.v); } }, .85);
      tl.fromTo("#r2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .32, ease: "power3.out" }, 1.0);
      tl.to(c2, { v: 22, duration: .7, ease: "power2.out",
        onUpdate: () => { e2.textContent = Math.round(c2.v); } }, 1.15);
      tl.fromTo("#r3", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .32, ease: "power3.out" }, 1.3);
      tl.to(c3, { v: 1.8, duration: .8, ease: "power2.out",
        onUpdate: () => { e3.textContent = c3.v.toFixed(2); } }, 1.45);
      tl.fromTo("#r4", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .32, ease: "power3.out" }, 1.7);
      tl.call(() => { document.querySelector("#v4").textContent = "PASS"; }, null, 2.05);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: .35, ease: "power2.out" }, 2.3);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: .3, ease: "power2.out" }, 2.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
