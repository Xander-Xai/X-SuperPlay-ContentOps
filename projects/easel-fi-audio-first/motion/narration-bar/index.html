<!doctype html>
<html lang="zh-CN" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans CJK SC"; src: local("Noto Sans CJK SC"); }
      @font-face { font-family: "Cascadia Mono"; src: local("Cascadia Mono"); }
      @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
      :root {
        --base: #0f1117; --surface: #161a22; --ink: #f5f7fa;
        --muted: #8b95a5; --accent: #38bdf8; --line: #2a3240;
        --sans: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        --mono: "Cascadia Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--base); }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--base); color: var(--ink); overflow: hidden; }
      #scene { position: absolute; inset: 0; width: 1080px; height: 1920px; transform-origin: 50% 42%; }
      #grain { position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: .05;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
      .topline { position: absolute; left: 86px; right: 86px; top: 96px; display: flex;
        justify-content: space-between; font-family: var(--mono); font-size: 28px;
        letter-spacing: .18em; color: var(--muted); }
      .topline .tag { color: var(--accent); }
      .topline span { white-space: nowrap; }
      #rule { position: absolute; left: 86px; top: 150px; width: 908px; height: 2px;
        background: var(--accent); transform-origin: left center; }
      h1 { position: absolute; left: 86px; top: 210px; width: 908px; font-family: var(--sans);
        font-size: 84px; line-height: 1.22; font-weight: 300; letter-spacing: -.02em; }
      h1 span { display: block; opacity: 0; }
      #track { position: absolute; left: 86px; top: 560px; width: 908px; height: 68px;
        background: var(--surface); border-radius: 8px; overflow: hidden; }
      #fill { width: 100%; height: 100%; background: var(--accent); transform-origin: left center; }
      #barLabel { position: absolute; left: 86px; right: 86px; top: 640px; display: flex;
        justify-content: space-between; font-family: var(--mono); font-size: 28px;
        color: var(--muted); opacity: 0; }
      #cells { position: absolute; left: 86px; top: 800px; display: flex; gap: 5px; }
      .cell { width: 36px; height: 84px; background: var(--accent); border-radius: 3px;
        transform-origin: bottom center; }
      #cellLabel { position: absolute; left: 86px; right: 86px; top: 910px; display: flex;
        justify-content: space-between; font-family: var(--mono); font-size: 28px;
        color: var(--muted); opacity: 0; }
      #math { position: absolute; left: 86px; top: 1040px; font-family: var(--sans);
        font-size: 60px; font-weight: 300; opacity: 0; }
      #math b { color: var(--accent); font-weight: 400; }
      #note { position: absolute; left: 86px; top: 1160px; font-family: var(--sans);
        font-size: 36px; line-height: 1.5; color: var(--muted); opacity: 0; }
      #foot { position: absolute; left: 86px; right: 86px; top: 1390px;
        display: flex; justify-content: space-between; border-top: 1px solid var(--line);
        padding-top: 16px; font-family: var(--mono); font-size: 28px;
        letter-spacing: .1em; color: var(--muted); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5"
         data-width="1080" data-height="1920">
      <div id="grain"></div>
      <div id="scene">
      <div id="topline" class="topline clip" data-start="0" data-duration="5" data-track-index="0">
        <span class="tag">[ 未来智能 · 工程 ]</span><span>LENGTHS</span>
      </div>
      <div id="rule" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <h1 id="head" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <span>口播四十四秒，</span><span>画面不能停。</span>
      </h1>
      <div id="track" class="clip" data-start="0" data-duration="5" data-track-index="2">
        <div id="fill"></div>
      </div>
      <div id="barLabel" class="clip" data-start="0" data-duration="5" data-track-index="3">
        <span>NARRATION 44.0 s</span><span id="cellsCount">VIEWS 0</span>
      </div>
      <div id="cells" class="clip" data-start="0" data-duration="5" data-track-index="4"></div>
      <div id="cellLabel" class="clip" data-start="0" data-duration="5" data-track-index="5">
        <span>每个视图 2.0 s</span><span>共 22 个</span>
      </div>
      <div id="math" class="clip" data-start="0" data-duration="5" data-track-index="6">
        44 ÷ 2 = <b>22</b>
      </div>
      <div id="note" class="clip" data-start="0" data-duration="5" data-track-index="7">
        窗口跟着口播走，视图跟着语义走。
      </div>
      <div id="foot" class="clip" data-start="0" data-duration="5" data-track-index="8">
        <span>docs/CURRENT-STATE.md</span><span>01 / 03</span>
      </div>
      </div>
    </div>
    <script>
      const cells = document.querySelector("#cells");
      for (let i = 0; i < 22; i += 1) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cells.appendChild(cell);
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#scene", { scale: 1 }, { scale: 1.035, duration: 5, ease: "none" }, 0);
      const count = { v: 0 };
      const countEl = document.querySelector("#cellsCount");

      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power3.out" }, .05);
      tl.to("#head span:nth-child(1)", { opacity: 1, y: 0, duration: .38, ease: "power3.out" }, .25);
      tl.to("#head span:nth-child(2)", { opacity: 1, y: 0, duration: .38, ease: "power3.out" }, .45);
      tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, .8);
      tl.fromTo("#barLabel", { opacity: 0 }, { opacity: 1, duration: .3, ease: "power2.out" }, .9);
      tl.fromTo(".cell", { scaleY: 0, opacity: .2 }, { scaleY: 1, opacity: 1, duration: .28,
        ease: "back.out(2)", stagger: .055 }, 1.4);
      tl.to(count, { v: 22, duration: 1.25, ease: "power2.out",
        onUpdate: () => { countEl.textContent = "VIEWS " + Math.round(count.v); } }, 1.4);
      tl.fromTo("#cellLabel", { opacity: 0 }, { opacity: 1, duration: .3, ease: "power2.out" }, 2.6);
      tl.fromTo("#math", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, 2.8);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: .35, ease: "power2.out" }, 3.05);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: .3, ease: "power2.out" }, 3.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
