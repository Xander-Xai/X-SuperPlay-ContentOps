<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1920px}
 body{background:#0F1117;color:#F5F7FA;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
 .card{width:1080px;height:1920px;padding:96px 80px 400px;display:flex;flex-direction:column}
 .kicker{font-size:26px;letter-spacing:.16em;color:#8B95A5}
 .rule{height:2px;background:#38BDF8;margin-top:32px}
 h1{font-size:96px;line-height:1.22;font-weight:300;margin-top:120px;letter-spacing:-.02em}
 .chain{margin-top:90px;display:flex;flex-direction:column;gap:26px}
 .node{display:flex;align-items:center;justify-content:space-between;background:#161A22;border:1px solid #2A3240;border-radius:10px;padding:30px 34px}
 .node .k{font-size:30px;color:#8B95A5}
 .node .v{font-size:52px}
 .node.hl{border-color:#38BDF8}
 .node.hl .v{color:#38BDF8}
 .arrow{text-align:center;color:#38BDF8;font-size:38px}
 .spacer{flex:1}
 .footer{font-size:24px;color:#8B95A5;letter-spacing:.08em}
</style></head><body><div class="card">
 <div class="kicker">EASEL · 工程拆解</div><div class="rule"></div>
 <h1>重建之后：<br>结果可复算。</h1>
 <div class="chain">
   <div class="node"><span class="k">PLACEMENTS</span><span class="v">8</span></div>
   <div class="arrow">↓</div>
   <div class="node"><span class="k">VIEWS</span><span class="v">22</span></div>
   <div class="arrow">↓</div>
   <div class="node hl"><span class="k">最长冻结</span><span class="v">1.80 s</span></div>
   <div class="arrow">↓</div>
   <div class="node hl"><span class="k">QC</span><span class="v">PASS</span></div>
 </div>
 <div class="spacer"></div>
 <div class="footer">projects/easel-1024-proof/receipts/qc-report.json</div>
</div></body></html>
