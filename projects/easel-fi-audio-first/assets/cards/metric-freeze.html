<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1920px}
 body{background:#0F1117;color:#F5F7FA;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
 .card{width:1080px;height:1920px;padding:96px 80px 400px;display:flex;flex-direction:column}
 .kicker{font-size:26px;letter-spacing:.16em;color:#8B95A5}
 .rule{height:2px;background:#38BDF8;margin-top:32px}
 .big{margin-top:220px;font-size:260px;line-height:1;font-weight:300;letter-spacing:-.04em}
 .big span{font-size:120px;color:#8B95A5;margin-left:16px}
 .limit{font-size:56px;color:#8B95A5;margin-top:48px}
 .limit b{color:#F5F7FA;font-weight:400}
 .verdict{margin-top:100px;display:inline-block;border:1px solid #38BDF8;color:#38BDF8;border-radius:10px;padding:28px 44px;font-size:44px;letter-spacing:.14em;align-self:flex-start}
 .spacer{flex:1}
 .footer{font-size:24px;color:#8B95A5;line-height:1.6}
</style></head><body><div class="card">
 <div class="kicker">QC · 2026-10-27</div><div class="rule"></div>
 <div class="big">1.80<span>s</span></div>
 <div class="limit">最长冻结 run　上限 <b>2.20 s</b></div>
 <div class="verdict">QC PASS</div>
 <div class="spacer"></div>
 <div class="footer">projects/easel-1024-proof/receipts/qc-report.json<br>static_hold_within_limit</div>
</div></body></html>
