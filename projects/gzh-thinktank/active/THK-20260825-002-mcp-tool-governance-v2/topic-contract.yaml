schema_version: 1
status: approved
canonical_topic: "MCP工具调用的生产治理"
topic_thesis: "Agent能够调用工具不等于能够安全上线；生产级Agent必须在工具调用边界建立权限、审批、序列约束、审计与回滚控制。"
reader_problem: "开发者可以把MCP接通，却缺少判断何时允许写入、何时需要审批、如何审计和限制连续调用的工程方案。"
scope:
  in_scope:
    - "MCP请求边界、工具身份、参数和执行结果"
    - "Agent权限、人工审批、调用顺序、频率限制和敏感数据后的权限收缩"
    - "审计日志、拒绝原因、回滚路径和最小可复现实验"
  out_of_scope:
    - "模型排行榜、Prompt技巧和泛泛的Agent入门"
    - "未核验的厂商效果保证、融资消息或安全绝对化结论"
anchor:
  required_terms: ["MCP", "工具调用", "生产治理", "审批", "审计", "回滚"]
  aliases: ["Model Context Protocol", "Agent工具调用", "temporal policy", "Dogwood"]
  minimum_total_hits: 3
series:
  mode: cluster
  subtopics:
