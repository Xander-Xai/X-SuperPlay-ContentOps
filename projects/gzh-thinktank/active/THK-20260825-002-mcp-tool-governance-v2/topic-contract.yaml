      title: "MCP工具调用边界：从工具清单到执行结果"
      relation: core
      why_it_belongs: "先定义请求和工具边界，才能判断生产治理是否完整。"
      return_to_topic: "回到MCP工具调用的生产治理，作为权限与审计的输入合同。"
    - id: temporal-agent-policy
      title: "时间序列授权：为什么要检查连续动作"
      relation: adjacent
      why_it_belongs: "单次允许不代表动作序列安全，必须把历史和时间纳入策略。"
      return_to_topic: "回到连续调用、审批和回滚的治理闭环。"
    - id: explicit-tool-permissions
