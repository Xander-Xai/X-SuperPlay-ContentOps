  source_excerpt: "![配图：允许列表、权限提示与拒绝路径](imgs/section-03.png)\n\nAnthropic Claude Code\
    \ 的 CLI 文档给出了一个清晰的实现例子：`--allowedTools` 让匹配的工具**无需再次弹出权限提示即可执行**；`--permission-prompt-tool`\
    \ 可以把权限请求交给指定工具处理；`--disallowedTools` 才是拒绝规则，`--tools` 才用于限制工具可见性。也就是说，`--allowedTools`\
    \ 不是严格的“唯一允许列表”，未列出的工具不会因此自动消失。这是 Claude Code 的产品实现，不代表所有 MCP 客户端都默认采用同样的参数；但它说明了一条通用原则：工具权限应当可声明、可审查、可拒绝。\n\
    \n在自己的 Agent 网关里，可以采用同样的三段式：\n\n1. **默认拒绝**：没有出现在任务权限包里的工具，不进入模型可用列表。\n2. **风险分级**：读取、写入、外发、删除分别设定不同的审批门槛。\n\
    3. **运行时提示**：策略要求人工确认时，返回结构化的 require_approval，而不是让模型猜测下一步。\n\n不要只在系统提示词里写“请谨慎调用”。提示词是意图，策略引擎才是约束。\n\
    \n```python\ndef decide(tool_name, allowed_tools, risk_level, approved):\n   \
    \ if tool_name not in allowed_tools:\n        return \"deny\"\n    if risk_level\
    \ in {\"write\", \"external\", \"delete\"} and not approved:\n        return \"\
    require_approval\"\n    return \"allow\"\n```\n\n**协议能承载确认，不代表协议替你做审批。** MCP 2026-07-28\
    \ 新增的 Multi Round-Trip Requests（MRTR）允许工具在执行过程中返回 resultType 为“input_required”的结果，要求客户端补充用户确认或缺失参数，再用\
    \ inputResponses 重试原请求。这给“require_approval”提供了协议级交互通道；但谁可以审批、什么金额必须审批、批准多长时间有效，仍由应用侧策略决定。"
