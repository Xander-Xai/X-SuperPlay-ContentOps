  source_excerpt: '![配图：无状态请求与网关控制层](imgs/section-02.png)


    MCP 2026-07-28 changelog 的一个关键变化，是移除协议层的 session 和 `initialize/initialized` handshake。每个请求通过
    `_meta` 携带协议版本、客户端身份和客户端能力；对于 Streamable HTTP POST，请求还必须带上 `Mcp-Method` 与 `Mcp-Name`，网关、限流器或
    WAF 可以据此直接路由、计量，并做一部分前置授权判断，而不必先解析完整 JSON body。


    这里要注意两层边界：MCP 2026-07-28 已经定义了可选的 HTTP 传输层 OAuth 授权能力，包括 access token、资源指示和 issuer
    校验；但它不替企业决定“哪个 Agent 在什么业务任务下能调用 refund、金额上限是多少、是否必须经理审批”。细粒度的工具、参数和业务动作策略，仍然要由
    Host、Gateway 或策略系统实现。


    一个最小的请求审计记录，至少应包含：


    ```text

    request_id          每次工具调用唯一

    trace_id            贯穿同一任务/调用链

    timestamp           决策与执行发生的时间

    principal_id        真实主体；可附 tenant_id

    agent_id            发起调用的 Agent 身份

    tool_name/version   工具名与版本

    resource             被访问的资源

    arguments_redacted  脱敏后的参数，供审计阅读

    arguments_digest    完整参数摘要，供完整性校验

    policy_version      命中的策略版本

    decision             allow / deny / require_approval

    decision_reason      决策原因；可附 approval_id

    execution_status     最终执行状态

    result_digest        结果摘要

    idempotency_key      幂等键

    ```


    决策先落审计，再执行；执行结束后再补记实际结果。这是把协议边界转成生产边界的第一步。参数不应只保留一个不可读的 hash：审计人员需要脱敏视图，系统还需要摘要来校验完整性。'
