<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; }
  body { background:#0F1117; color:#F5F7FA;
         font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif; }
  .card { width:1080px; height:1920px; padding:112px 96px 400px;
          display:flex; flex-direction:column; }
  .kicker { font-size:28px; letter-spacing:.14em; color:#8B95A5; font-weight:500; }
  .rule { width:100%; height:2px; background:#38BDF8; margin-top:40px; }
  .spacer { flex:1; }
  h1 { font-size:108px; line-height:1.28; font-weight:300; letter-spacing:-.02em;
       max-width:888px; }
  .footer { font-size:26px; color:#8B95A5; line-height:1.6; margin-top:64px; }
  .mark { font-size:24px; letter-spacing:.18em; color:#8B95A5; margin-top:28px; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">EASEL · EVIDENCE CUT</div>
    <div class="rule"></div>
    <div class="spacer"></div>
    <h1>先看证据，再决定接不接。</h1>
    <div class="footer">证据来自同一次真实运行，人工审核是发布前的必经门禁。</div>
    <div class="mark">X-SUPERPLAY · 1024</div>
  </div>
</body>
</html>
