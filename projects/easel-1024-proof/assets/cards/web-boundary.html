<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; }
  body { background:#F2EDE4; color:#1A1714;
         font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif; }
  .card { width:1080px; height:1920px; padding:112px 96px 400px;
          display:flex; flex-direction:column; }
  .kicker { font-size:28px; letter-spacing:.14em; color:#6B6560; font-weight:500; }
  .rule { width:100%; height:2px; background:#1A1714; margin-top:40px; }
  h1 { font-size:124px; line-height:1.2; font-weight:300; letter-spacing:-.02em;
       margin-top:140px; max-width:888px; overflow-wrap:anywhere; word-break:break-word; }
  .signal { width:100%; height:14px; background:#C0392B; margin-top:88px; }
  .stamp { margin-top:96px; color:#C0392B; font-size:124px; line-height:1.04;
           font-weight:300; letter-spacing:-.035em; }
  .stamp small { display:block; font-size:30px; letter-spacing:.22em; color:#6B6560;
                 margin-bottom:28px; font-weight:500; }
  .spacer { flex:1; }
  .footer { font-size:26px; color:#6B6560; line-height:1.6; }
  .footer b { color:#1A1714; font-weight:500; }
  .mark { font-size:24px; letter-spacing:.18em; color:#6B6560; margin-top:28px; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">项目文档 · CURRENT-STATE.md</div>
    <div class="rule"></div>
    <h1>Web 工作台仍未验证。</h1>
    <div class="signal"></div>
    <div class="stamp"><small>文档状态</small>NOT VERIFIED</div>
    <div class="spacer"></div>
    <div class="footer"><b>引用文档原文，不是界面截图</b><br>docs/CURRENT-STATE.md<br>sha256 cb428fa6cf5c0a9198f73a15de225b385e8d32ffba6493ec4a02cac8a2779a3e</div>
    <div class="mark">EASEL · EVIDENCE CUT</div>
  </div>
</body>
</html>
