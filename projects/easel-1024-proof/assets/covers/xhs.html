<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; }
  body { background:#F2EDE4; color:#1A1714;
         font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif; }
  .card { width:1080px; height:1440px; padding:88px 80px 72px; display:flex; flex-direction:column; }
  .kicker { font-size:26px; letter-spacing:.16em; color:#6B6560; font-weight:500; }
  .rule { width:100%; height:2px; background:#1A1714; margin-top:32px; }
  h1 { font-size:150px; line-height:1.1; font-weight:300; letter-spacing:-.03em; margin-top:120px; }
  .signal { width:100%; height:14px; background:#C0392B; margin-top:64px; }
  .sub { font-size:48px; line-height:1.4; color:#3A3530; margin-top:56px; font-weight:400; }
  .quote { border-left:10px solid #C0392B; padding-left:32px; font-size:44px;
            line-height:1.45; margin-top:88px; color:#1A1714; }
  .ledger { margin-top:56px; border-top:1px solid #C9C0B4; }
  .ledger div { font-size:32px; line-height:1.45; padding:18px 0; border-bottom:1px solid #C9C0B4; color:#3A3530; }
  .spacer { flex:1; }
  .footer { display:flex; justify-content:space-between; align-items:flex-end;
            font-size:24px; color:#6B6560; line-height:1.6; }
  .mark { letter-spacing:.18em; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">EASEL · EVIDENCE</div>
    <div class="rule"></div>
    <h1>Web <br>仍未验证</h1>
    <div class="signal"></div>
    <p class="sub">Easel 实测：工具链通了，Web 还没</p>
    <div class="quote">边界：工具链可用，Web 还不能算交付。</div>
    <div class="ledger">
      <div>doctor 的七项核心检查，返回 0。</div>
      <div>项目文档记录：Web 工作台 6 项失败。</div>
    </div>
    <div class="spacer"></div>
    <div class="footer">
      <div>docs/CURRENT-STATE.md<br>2026-10-27</div>
      <div class="mark">X 超玩 · 1024</div>
    </div>
  </div>
</body>
</html>
